<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline — Skill India Connect</title>
    <style>
      /* Colours from src/styles/tokens.css — --color-primary-700 / --background. */
      :root { color-scheme: light; }
      body {
        margin: 0; min-height: 100vh;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 1.25rem; padding: 2rem 1.5rem; text-align: center;
        background: #ffffff; color: #1a3c6e;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      img { width: 88px; height: 88px; }
      h1 { margin: 0; font-size: 1.25rem; font-weight: 700; }
      p { margin: 0; color: #4a5568; font-size: 0.95rem; line-height: 1.6; max-width: 24rem; }
      .alt { font-size: 0.9rem; color: #4a5568; }
      .alt span { display: block; margin-top: 0.35rem; }
    </style>
  </head>
  <body>
    <img src="/icons/icon-192.png" alt="" />
    <h1>You're offline</h1>
    <p>Check your connection and try again. Your saved jobs and applications are safe.</p>
    <!--
      Deliberately a STATIC page: it must render with no JS and no network, so it
      cannot use next-intl. Three languages inline covers the largest groups; the
      rest see English. Documented as a known gap in docs/pwa-play-store.md.
    -->
    <div class="alt" dir="auto">
      <span lang="hi">आप ऑफ़लाइन हैं। कृपया अपना कनेक्शन जाँचें।</span>
      <span lang="ar" dir="rtl">أنت غير متصل بالإنترنت. تحقّق من اتصالك.</span>
    </div>
  </body>
</html>
