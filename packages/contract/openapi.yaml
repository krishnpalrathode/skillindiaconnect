openapi: 3.1.0
info:
  title: Skill India Connect API
  version: 0.9.0
  description: |
    Production blue-collar recruitment platform connecting skilled workers in India
    with employers in the Gulf and locally.

    **Contract freeze rule:** After the initial freeze merge, contract changes require
    a spec edit + `pnpm contract:generate` + a versioned amendment description in the
    commit / PR. Frontend and backend tracks build in parallel against this contract.

    **Base URL:** All versioned endpoints are under `/api/v1`. The `/health` endpoint
    is unversioned and served at the root (see path entry for details).

    **Auth:** JWT bearer token (`Authorization: Bearer <token>`). Access tokens are
    short-lived (15 min). Refresh tokens are delivered as an HttpOnly cookie
    (`sic_refresh`) via `POST /auth/refresh`. Public endpoints carry `security: []`.

    **S2 additions (Sprint 2):** Employer identity, jobs + lifecycle, public job
    search, candidate notifications, admin settings + employer approval.

    **S3 additions (Sprint 3):** Employer profile (hiring preferences, contact
    persons, logo); real employer dashboard shape (totalJobViews, hiredThisMonth,
    profileChecklist); employer-views-candidate with privacy subset
    (CandidateEmployerView); minimal candidate browse (CandidateBrowseCard);
    profile-view analytics for candidates (ProfileViewsSummary). Three locked
    decisions: (1) candidates with profileVisible=false return 404 identical to
    nonexistent; (2) employer context exposes document status/validity ONLY — no
    keys or URLs; (3) profileChecklist is computed per-request, no stored percentage.

    **S7 additions (Sprint 7 / CR-001, frozen in S7-0):** the resume builder —
    settings CRUD, ASYNC PDF generation (202 trigger + status poll, the S5
    payments discipline), the RESUME-VIEW as a THIRD viewer context whose
    omissions are driven by Resume Settings (not the profile privacy toggles;
    passport number may appear here by the candidate's own choice though the
    employer context never carries it), and delivery (WhatsApp-to-own-number
    with email degradation + 5/day cap; email-to-self, uncapped). Locked OUT:
    the public slug page (dormant column stays dormant, no public endpoint),
    video portfolio, hi/ar rendering (language enum is en-only until a
    translated template ships).

    **S5 additions (Sprint 5):** Billing — plans, checkout, orders, subscription
    status, invoices, payment webhooks, and the Pro document-URL gate. Locked
    semantics: (1) **server-side gateway routing** — the checkout REQUEST carries
    `{ planCode }` only, NO gateway field exists on it; the RESPONSE tells the
    frontend which gateway to launch (a client cannot force a gateway);
    (2) **money is integer subunits** (paise/cents) in every schema — no floats
    anywhere; (3) **activation is webhook-only** — the gateway success callback
    changes nothing; the frontend polls `GET /billing/orders/{id}` until the
    webhook flips it to PAID; (4) checkout accepts an `Idempotency-Key` header
    (Redis, 24 h) and order-status is safe to poll.

servers:
  - url: /api/v1
    description: Versioned API

tags:
  - name: health
    description: Unversioned liveness/readiness probe
  - name: auth
    description: Authentication — email/password, Google OAuth, OTP login, password reset
  - name: candidate
    description: Candidate profile, onboarding, documents, and account management
  - name: notifications
    description: In-app notifications for candidates (S2)
  - name: resume
    description: Resume settings, generation, download, and delivery (Sprint 7)
  - name: employer
    description: >
      Employer company registration, dashboard, and job management (S2 full).
      Employer profile (hiring prefs, contacts, logo) and candidate profile views
      in employer context (S3 full).
  - name: jobs
    description: >
      Job listings — public search and detail (S2), employer CRUD + lifecycle (S2),
      candidate save (S2). Apply flow → S4.
  - name: payments
    description: >
      Billing — plans, checkout, orders, subscription status, invoices (S5 full).
      Server-side gateway routing; integer-subunit money; webhook-only activation.
  - name: webhooks
    description: >
      Server-to-server payment-gateway webhooks (S5). Signature IS the auth
      (verify-before-parse on the raw body). NOT consumed by the web app and
      deliberately EXCLUDED from the MSW mocks — the mocks simulate their EFFECT
      (the delayed order flip) instead.
  - name: admin
    description: >
      Admin — employer approval + platform settings (S2 full). Full moderation
      (candidates, jobs, applications, roles, logs) → S6.

security:
  - bearerAuth: []

# ─── Components ──────────────────────────────────────────────────────────────

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Short-lived JWT access token issued by login / signup / OAuth / OTP-verify.
        Deliver in `Authorization: Bearer <token>`. Refresh via `POST /auth/refresh`
        (uses the `sic_refresh` HttpOnly cookie, not this header).

  parameters:
    CursorParam:
      name: cursor
      in: query
      description: Opaque keyset cursor for cursor-paginated feeds
      schema:
        type: string

    LimitParam:
      name: limit
      in: query
      description: Page size for cursor-paginated feeds (default 20, max 100)
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

    PageParam:
      name: page
      in: query
      description: 1-based page number for offset-paginated admin tables
      schema:
        type: integer
        minimum: 1
        default: 1

    PageSizeParam:
      name: pageSize
      in: query
      description: Items per page for offset-paginated admin tables (default 20, max 100)
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

    SortParam:
      name: sort
      in: query
      description: >
        Sort expression in the format `field:asc` or `field:desc`.
        Allowed fields are whitelisted per endpoint.
      schema:
        type: string
        pattern: '^[a-zA-Z]+:(asc|desc)$'

    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: false
      description: >
        Client-generated idempotency key (S5 checkout). The server stores the
        FIRST response for this key in Redis for 24 h and replays it verbatim
        for any retry carrying the same key — a double-click or a network retry
        never creates a second order. Recommended value: a UUID v4 minted per
        checkout intent (not per attempt).
      schema:
        type: string
        maxLength: 128

  responses:
    # S6 — the single RBAC denial shape for every admin endpoint. `meta` names the
    # permission the caller lacked, so the console can say WHICH grant is missing
    # instead of a bare "forbidden".
    AdminForbidden:
      description: >
        The caller's role does not hold the permission this endpoint requires.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            type: about:blank
            title: Forbidden
            status: 403
            detail: You do not have permission to perform this action.
            code: FORBIDDEN
            meta:
              requiredPermission: logs.export

  schemas:
    # ── Error envelope (RFC 7807-style) ────────────────────────────────────────
    Error:
      type: object
      required: [type, title, status, detail, code]
      properties:
        type:
          type: string
          description: URI reference identifying the problem type
          example: about:blank
        title:
          type: string
          description: Human-readable summary (localizable)
          example: Email already registered
        status:
          type: integer
          description: HTTP status code
          example: 409
        detail:
          type: string
          description: Human-readable explanation (localizable)
          example: An account with this email address already exists.
        code:
          type: string
          description: >
            Machine-readable error code — the stable contract field.
            Examples: EMAIL_TAKEN, INVALID_CREDENTIALS, ACCOUNT_SUSPENDED,
            INVALID_OTP, PHONE_NOT_ON_WHATSAPP, PROFILE_INCOMPLETE,
            MANDATORY_DOCS_MISSING, ILLEGAL_TRANSITION, EMPLOYER_NOT_APPROVED,
            WORKER_PROTECTION_VIOLATION, JOB_QUOTA_EXCEEDED, CORE_RULE_FORBIDDEN,
            PLAN_NOT_PURCHASABLE, SUBSCRIPTION_ALREADY_ACTIVE,
            GATEWAY_UNAVAILABLE, PLAN_UPGRADE_REQUIRED, NOT_IMPLEMENTED.
          example: EMAIL_TAKEN
        meta:
          type: object
          description: >
            Additional context. Validation errors carry `meta.errors[]` with
            per-field machine codes. Publish errors carry `meta.violations[]`
            or `meta.planLimit`.
          additionalProperties: true

    # ── Domain enums ────────────────────────────────────────────────────────────
    UserRole:
      type: string
      enum: [CANDIDATE, EMPLOYER, SUPER_ADMIN, ADMIN, MODERATOR, SUPPORT]
      description: >
        MODERATOR and SUPPORT are admin-side roles that exist in the database and
        the seeded RBAC matrix from S2 but were missing from this enum until S6
        made them addressable (they are matrix columns on Screen 27, and audit
        rows carry them as `actorRole`).

    UserStatus:
      type: string
      enum: [ACTIVE, SUSPENDED, PENDING_DELETION]

    MaritalStatus:
      type: string
      enum: [SINGLE, MARRIED, DIVORCED, WIDOWED]

    ExperienceType:
      type: string
      enum: [INDIA, FOREIGN]

    DocumentType:
      type: string
      enum: [PASSPORT, EXPERIENCE_CERT, EDUCATIONAL_CERT]
      description: >
        Document types accepted at MVP. WORKING_VIDEO is deferred to Phase 2
        and MUST NOT be submitted via POST /candidates/me/documents/presign.

    DocumentStatus:
      type: string
      enum: [PENDING, VERIFIED, REJECTED]

    # ── Employer enums (S2) ─────────────────────────────────────────────────────
    CompanyType:
      type: string
      enum: [LOCAL, FOREIGN]
      description: LOCAL = Indian company hiring domestically; FOREIGN = Gulf/overseas employer.

    CompanyStatus:
      type: string
      enum: [PENDING, APPROVED, REJECTED, SUSPENDED]
      description: >
        Lifecycle of an employer company profile. New registrations start PENDING.
        An admin with `employers.approve_reject` moves them to APPROVED or REJECTED.
        APPROVED employers can post jobs. SUSPENDED employers cannot post; their
        active jobs are paused automatically.

    EmployeeRange:
      type: string
      enum: ['1-10', '11-50', '51-200', '201-500', '500+']

    # ── Job enums (S2) ──────────────────────────────────────────────────────────
    JobStatus:
      type: string
      enum: [DRAFT, PENDING_REVIEW, ACTIVE, PAUSED, ARCHIVED]
      description: >
        DRAFT — visible only to the owning employer, not in public search.
        PENDING_REVIEW — published while the `jobs.require_admin_approval`
        setting is ON, so it awaits admin resolution and is NOT yet live. It
        exists in the database from S2-B5 but was only addressable on the ADMIN
        surface, which S6 adds (`POST /admin/jobs/{id}/review`). No employer or
        public list returns it.
        ACTIVE — live in public search; candidates can save and apply (S4).
        PAUSED — hidden from public search; can be resumed to ACTIVE.
        ARCHIVED — permanent, read-only; cannot be un-archived.

    JobMarket:
      type: string
      enum: [GULF, LOCAL]

    GenderPreference:
      type: string
      enum: [MALE, FEMALE, ANY]

    # ── Notification enums (S2 + S3) ───────────────────────────────────────────
    VerificationCallRequest:
      type: object
      required: [slotAt, requestedAt]
      description: |
        An employer's request for a live verification call instead of waiting
        out the standard review. ONE per company — re-booking replaces it.
      properties:
        slotAt:
          type: string
          format: date-time
          description: The proposed start, UTC.
        note:
          type: [string, 'null']
          maxLength: 500
        requestedAt:
          type: string
          format: date-time

    CandidateActivityStatus:
      type: string
      description: |
        How recently a candidate actually used the platform, derived at read
        time from their last sign-in. DISTINCT from , which is what
        the candidate declares — this is what they do.

        ACTIVE = signed in within 7 days · RECENT = within 30 · INACTIVE = longer
        ago, or never. Deliberately coarse: an employer needs to decide whether
        to call, not to see a person's login timestamp.
      enum: [ACTIVE, RECENT, INACTIVE]

    NotificationType:
      type: string
      description: >
        Must match the Prisma `NotificationType` enum (the DB source of truth).
        PROFILE_VIEWED fires when an employer views a candidate's full profile
        (deduplicated per company per rolling 24 h window). Data payload:
        `{ companyName: string }`.
        PASSPORT_EXPIRY fires when a passport is within the reminder window.
        Data payload: `{ expiryDate: string, daysRemaining: integer }`.
      enum:
        [
          APPLICATION_SELECTED,
          APPLICATION_SHORTLISTED,
          APPLICATION_REJECTED,
          NEW_JOB_MATCH,
          PROFILE_REMINDER,
          JOB_CLOSING_SOON,
          PASSPORT_EXPIRY,
          PROFILE_VIEWED,
          EMPLOYER_APPROVED,
          EMPLOYER_REJECTED,
          EMPLOYER_SUSPENDED,
          SUBSCRIPTION_PURCHASED,
          SUBSCRIPTION_EXPIRING,
          SUBSCRIPTION_EXPIRED,
          CANDIDATE_MATCHES,
          RESUME_SENT,
          RESUME_READY,
          JOB_APPROVED,
          JOB_REJECTED,
          JOB_POSTED_ONBEHALF,
          VERIFICATION_CALL_REQUESTED,
          CANDIDATE_INACTIVE_CHECK_IN,
        ]

    # ── Settings enums (S2) ─────────────────────────────────────────────────────
    # (SettingGroup removed in S6a-F2 — grouping is a CLIENT concern derived from
    # the setting key's prefix; the server never returned a group field.)

    # ── Shared objects ──────────────────────────────────────────────────────────
    UserSummary:
      type: object
      required: [id, email, role]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/UserRole'

    AuthTokenResponse:
      type: object
      required: [user, accessToken]
      description: >
        Returned on successful signup, email/password login, Google OAuth, and
        OTP login. The `accessToken` (JWT, 15 min) must be stored by the client.
        A long-lived refresh token is delivered as the `sic_refresh` HttpOnly
        cookie (path `/api/v1/auth`) — do NOT try to read or send it manually.
      properties:
        user:
          $ref: '#/components/schemas/UserSummary'
        accessToken:
          type: string
          description: Short-lived JWT access token (15 min)

    # ── Candidate schemas ────────────────────────────────────────────────────────
    WorkExperience:
      type: object
      required: [id, type]
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/ExperienceType'
        country:
          type: string
          example: UAE
        companyName:
          type: string
        role:
          type: string
        years:
          type: integer
          minimum: 0
        months:
          type: integer
          minimum: 0
          maximum: 11
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date

    CandidateSkill:
      type: object
      required: [id, name]
      description: >
        Only the first 3 skills contribute to the match score.
        More than 3 skills can be stored but additional ones do not score.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string

    CandidateDocument:
      type: object
      required: [id, type, key, status, uploadedAt]
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/DocumentType'
        key:
          type: string
          description: R2 storage key — use signed download URLs; never expose raw keys to untrusted callers
        status:
          $ref: '#/components/schemas/DocumentStatus'
        uploadedAt:
          type: string
          format: date-time
        expiryDate:
          type: string
          format: date
          description: Passport expiry date (PASSPORT type only; set during confirm step)

    CandidateVideoStatus:
      type: object
      required: [hasVideo]
      description: |
        The candidate's working-video introduction, plus the limits currently in
        force. `maxMb` / `maxDurationSec` are echoed so the UI can state the
        real ceilings rather than keeping its own copy that drifts when a
        Super-Admin changes the Setting.
      properties:
        hasVideo:
          type: boolean
        uploadedAt:
          type: [string, 'null']
          format: date-time
        durationSec:
          type: [integer, 'null']
          description: Rounded to whole seconds on write.
        sizeBytes:
          type: [integer, 'null']
          description: The REAL stored size, read back from the object.
        maxMb:
          type: integer
          description: Present on GET /candidates/me/video; absent on confirm/delete.
        maxDurationSec:
          type: integer
          description: Present on GET /candidates/me/video; absent on confirm/delete.

    CandidateProfile:
      type: object
      required: [id, email, role]
      description: |
        Candidate profile shape. **Privacy rules (viewer-aware DTOs):**
        - `phone` is omitted in employer/admin contexts when `showPhone = false` (default off).
        - `religion` is omitted in employer/admin contexts when `showReligion = false` (default off).
        - Self-view (`GET /candidates/me`) always includes both fields regardless of toggles.
        - Internal application notes are NEVER serialized to employer or candidate contexts.
        - `passportNumber` is only in the PDF renderer context and only when `showPassportNumber = true`.
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/UserRole'
        fullName:
          type: string
        photoUrl:
          type: [string, 'null']
          description: >
            Short-expiry SIGNED url for the profile photo (never the raw R2
            key), or null when none is uploaded. Set via the
            /candidates/me/photo/presign + /confirm flow.
        fatherName:
          type: string
        dob:
          type: string
          format: date
        phone:
          type: string
          description: Toggle-controlled in non-self contexts (showPhone). Always present in self-view.
          example: '+919876543210'
        phoneVerifiedAt:
          type: [string, 'null']
          format: date-time
        whatsappCapable:
          type: [boolean, 'null']
          description: Set to true when OTP verification succeeds via WhatsApp channel
        maritalStatus:
          $ref: '#/components/schemas/MaritalStatus'
        religion:
          type: string
          description: Toggle-controlled in non-self contexts (showReligion). Always present in self-view.
        languages:
          type: array
          items:
            type: string
        jobCategoryId:
          type: [string, 'null']
          format: uuid
        currentLocation:
          type: string
        nationality:
          type: string
        noticePeriod:
          type: integer
          description: Notice period in days
        summary:
          type: [string, 'null']
          maxLength: 500
          description: >-
            Candidate-written intro rendered at the top of the resume. Self
            context only — never serialized to employer or admin views.
        completionPct:
          type: integer
          minimum: 0
          maximum: 100
          description: Server-computed, single-source profile completion percentage
        profileVisible:
          type: boolean
          default: true
        isAvailable:
          type: boolean
          default: true
        salaryExpectationMin:
          type: [integer, 'null']
        salaryExpectationMax:
          type: [integer, 'null']
        salaryExpectationCurrency:
          type: string
          default: INR
        experiences:
          type: array
          items:
            $ref: '#/components/schemas/WorkExperience'
        skills:
          type: array
          items:
            $ref: '#/components/schemas/CandidateSkill'
        documents:
          type: array
          items:
            $ref: '#/components/schemas/CandidateDocument'
        status:
          $ref: '#/components/schemas/UserStatus'
        createdAt:
          type: string
          format: date-time

    CompletionSection:
      type: object
      required: [key, label, pct, complete]
      properties:
        key:
          type: string
        label:
          type: string
        pct:
          type: integer
          minimum: 0
          maximum: 100
        complete:
          type: boolean

    CompletionResult:
      type: object
      required: [pct, sections, canApply, missingForApply]
      description: >
        Server-computed, single-source profile completion. The `canApply` gate
        requires pct ≥ threshold AND all mandatory documents present AND passport
        not expired. This is enforced at apply time (Sprint 4), not at
        complete-onboarding time.
      properties:
        pct:
          type: integer
          minimum: 0
          maximum: 100
        sections:
          type: array
          items:
            $ref: '#/components/schemas/CompletionSection'
        canApply:
          type: boolean
        missingForApply:
          type: array
          items:
            type: string
          description: Human-readable list of items blocking the apply gate

    ResumeSettings:
      type: object
      required: [language, showPhone, showReligion, showFatherName, showPassportNumber, template]
      description: |
        Resume PDF rendering settings (CR-001, frozen in S7-0).

        **These drive the RESUME-VIEW — the product's THIRD viewer context**
        (after candidate-self and employer-context). Its omissions are decided
        by THESE toggles, NOT the profile privacy toggles: a candidate may show
        their passport number on their own resume (their document, their
        choice) even though the employer context NEVER carries it. The two
        contexts are distinct by design — this is not a privacy regression.

        **Settings apply at GENERATION TIME.** A PATCH after a PDF was
        generated does NOT alter the stored PDF — the candidate regenerates to
        apply the change. Hidden fields (toggle = false) must be ABSENT FROM
        THE PDF BYTES, not merely hidden in a preview.

        Defaults for a candidate who never opened the settings:
        showPhone ON, showFatherName ON (confirmed against the S1 data design —
        candidate_resumes.showFatherName defaults true; the pre-S7 draft of
        this schema said false and was corrected at freeze), showReligion OFF,
        showPassportNumber OFF.
      properties:
        language:
          type: string
          enum: [en]
          default: en
          description: >
            The PDF's language (CR-001's `resumeLanguage`). ENGLISH-ONLY at
            MVP: the enum deliberately lists ONLY `en` — hi/ar rendering is
            deferred, and their values will be ADDED to this enum when a
            translated template ships. Representing the constraint in the enum
            (rather than accepting hi/ar and failing later) means a client
            cannot request a language the renderer doesn't have.
        showPhone:
          type: boolean
          default: true
          description: false → `ResumeView.phone` is omitted from the PDF.
        showReligion:
          type: boolean
          default: false
          description: false (the default) → `ResumeView.religion` is omitted.
        showFatherName:
          type: boolean
          default: true
          description: false → `ResumeView.fatherName` is omitted.
        showPassportNumber:
          type: boolean
          default: false
          description: >
            false (the default) → `ResumeView.passportNumber` is omitted.
            Passport EXPIRY/validity is part of the documents summary and is
            not governed by this toggle — only the number itself is.
        template:
          type: string
          enum: [CLASSIC, MODERN, COMPACT, MINIMAL, ELEGANT, EXECUTIVE, TIMELINE]
          default: CLASSIC
          description: |
            Which HTML template renders the PDF (CR-001 B1/B2). Applied at
            GENERATION time like every other setting — changing it does NOT
            alter an already-generated PDF; the candidate regenerates.

            **The enum lists only the templates that actually exist**, exactly
            as `language` above lists only `en`, and for the same reason: a
            client must not be able to request something that will not happen.
            B1 shipped this enum as `[CLASSIC]` alone; B2 widened it as it added
            the three renderers. A future template belongs here only once its
            renderer does.

            - `CLASSIC` — traditional single column. The safe choice for formal
              Gulf employer submissions, and the default.
            - `MODERN` — clean single column with an accent colour and generous
              whitespace. Recommended for most candidates.
            - `COMPACT` — two columns; fits more experience on one page.
            - `MINIMAL` — plain linear structure, no photo, the most
              ATS-friendly.

            The template is a RENDERING choice, never a privacy one. Every
            template renders the same `ResumeView`, whose omissions are decided
            by the toggles above BEFORE any template sees the data — so the
            choice of template cannot change which fields reach the PDF.

            CLASSIC is the default deliberately: it is the template that has
            always rendered, and defaulting to a new look would silently change
            the appearance of resumes candidates have already sent to employers.

    ResumeGeneration:
      type: object
      required: [generationId, status]
      description: |
        One asynchronous PDF generation (S7-0). Generation is WORKER-SIDE and
        takes seconds — the client POLLS `GET /candidates/me/resume/status`
        until READY (the same pending→confirmed discipline as S5 payments;
        there is no synchronous render).

        READY carries a SHORT-EXPIRY signed R2 GET url. The stored PDF is a
        SNAPSHOT of the profile + settings at generation time: changing
        settings after READY does not alter it — regenerate to apply.
      properties:
        generationId:
          type: string
          format: uuid
        status:
          type: string
          enum: [PENDING, READY, FAILED]
        resumeId:
          type: string
          format: uuid
          description: Present once READY — the stored resume this render belongs to.
        downloadUrl:
          type: string
          format: uri
          description: Present once READY — a short-expiry signed R2 GET url.
        expiresInSeconds:
          type: integer
          example: 300
          description: Present once READY — the signed url's remaining validity.
        generatedAt:
          type: string
          format: date-time
          description: Present once READY.
        failureReason:
          type: string
          description: Present when FAILED — human-readable; retry by regenerating.
        view:
          $ref: '#/components/schemas/ResumeView'
          description: >
            Present once READY — the exact field set the PDF was rendered
            from (the settings snapshot applied). The F1 preview renders this;
            the B1 template consumes the same shape — one source of truth for
            what the PDF contains.

    ResumeView:
      type: object
      required: [fullName, email, experiences, skills, generatedAt, settingsApplied]
      description: |
        **The THIRD viewer context** (S7-0): exactly the field set the resume
        PDF renders. Omissions are driven by `ResumeSettings` — captured at
        generation time — never by the profile privacy toggles:

        - `showPhone: false`          → `phone` ABSENT
        - `showReligion: false`       → `religion` ABSENT (default off)
        - `showFatherName: false`     → `fatherName` ABSENT
        - `showPassportNumber: false` → `passportNumber` ABSENT (default off)

        Everything else renders unconditionally when the profile has it.
        `passportNumber` MAY appear here (the candidate's own document, their
        explicit opt-in) even though the employer context never carries it —
        distinct contexts, distinct rules. Do NOT reuse the employer-context
        mapper for this shape.

        Out of scope, locked at this freeze: the public slug page (the dormant
        `publicSlug` column stays dormant — no public endpoint exists), the
        video portfolio section (renders only when a video exists — Phase 2),
        and hi/ar rendering (see `ResumeSettings.language`).
      properties:
        fullName:
          type: string
        photoUrl:
          type: [string, 'null']
          description: Short-expiry signed url for the profile photo, when uploaded.
        email:
          type: string
          format: email
          description: Always included — the candidate's own account email.
        phone:
          type: string
          description: "OMITTED when `showPhone: false`."
        fatherName:
          type: string
          description: "OMITTED when `showFatherName: false`."
        religion:
          type: string
          description: "OMITTED when `showReligion: false` (the default)."
        passportNumber:
          type: string
          description: >
            OMITTED when `showPassportNumber: false` (the default). Never
            present in any employer-context schema regardless of this toggle.
        dob:
          type: [string, 'null']
          format: date
        maritalStatus:
          type: [string, 'null']
        nationality:
          type: [string, 'null']
        currentLocation:
          type: [string, 'null']
        summary:
          type: [string, 'null']
          description: >-
            The candidate's own intro, rendered at the TOP of the resume above
            the personal details. Null when they have not written one — every
            template omits the block entirely rather than leaving a gap.
        languages:
          type: array
          items:
            type: string
        jobCategory:
          type: [string, 'null']
          description: Display name of the candidate's job category.
        experiences:
          type: array
          items:
            $ref: '#/components/schemas/WorkExperience'
        skills:
          type: array
          items:
            $ref: '#/components/schemas/CandidateSkill'
        documents:
          type: array
          description: >
            Status-only documents summary (type + validity) — the same
            discipline as the employer context; keys/urls never appear.
          items:
            $ref: '#/components/schemas/CandidateDocumentStatus'
        generatedAt:
          type: string
          format: date-time
        settingsApplied:
          $ref: '#/components/schemas/ResumeSettings'

    ResumeDeliveryResult:
      type: object
      required: [delivered]
      description: |
        The honest enqueue-time answer for a resume delivery (S7-0).
        `WHATSAPP` — the document send was enqueued to the candidate's OWN
        verified number. `EMAIL_FALLBACK` — the candidate is not
        WhatsApp-capable, so the send DEGRADED to email-to-self (a 202, not an
        error: the resume still reaches them). `EMAIL` — the email-to-self
        endpoint's normal outcome.
      properties:
        delivered:
          type: string
          enum: [WHATSAPP, EMAIL_FALLBACK, EMAIL]

    # ── Employer schemas (S2) ───────────────────────────────────────────────────
    Company:
      type: object
      required: [id, name, type, status, createdAt]
      description: |
        Employer company profile. Returned to the owning employer and to admins.
        Never returned on public job endpoints — use `JobCard.companyName` there.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        type:
          $ref: '#/components/schemas/CompanyType'
        status:
          $ref: '#/components/schemas/CompanyStatus'
        registrationNumber:
          type: [string, 'null']
          description: Optional at registration; null when the employer did not supply one
        industryType:
          type: string
        phoneCode:
          type: [string, 'null']
          description: Dial code for `phone`, e.g. "+91". Null for companies registered before the field existed.
          example: '+91'
        phone:
          type: string
        country:
          type: [string, 'null']
          description: Company country. Null for companies registered before the field existed.
          example: India
        location:
          type: string
          description: City or area within `country`
        website:
          type: string
          format: uri
        foundedYear:
          type: [integer, 'null']
          description: >
            Year the company was founded. NULL only for companies registered
            before the field existed — it is required for every new
            registration, and deliberately not backfilled, because a guessed
            founding year would be indistinguishable from a stated one.
          example: 2014
        employeeRange:
          $ref: '#/components/schemas/EmployeeRange'
        languagePref:
          type: string
          enum: [en, hi, bn, mr, te, ta, gu, kn, ml, pa, or, as, ne, tl, id, si, am, sw, ur, fa, ps, ar]
          default: en
        description:
          type: string
        registrationCertKey:
          type: [string, 'null']
          description: R2 key for the uploaded registration certificate document
        rejectionReason:
          type: [string, 'null']
          description: Populated after admin rejection; visible to the employer
        createdAt:
          type: string
          format: date-time
        approvedAt:
          type: [string, 'null']
          format: date-time

    EmployerDashboardKpi:
      type: object
      required: [activeJobs, totalApplications, shortlisted, totalJobViews, hiredThisMonth]
      description: >
        Employer dashboard KPIs. As of Sprint 4, `totalApplications` and
        `shortlisted` are LIVE application counts across the employer's jobs
        (they were honest zeros in S3). `totalJobViews` and `hiredThisMonth`
        are S3 KPIs.
      properties:
        activeJobs:
          type: integer
        totalApplications:
          type: integer
          description: Total applications across all the employer's jobs (live in S4).
        shortlisted:
          type: integer
          description: Applications in SHORTLISTED status across the employer's jobs (live in S4).
        totalJobViews:
          type: integer
          description: Total views across all the employer's job postings (S3)
        hiredThisMonth:
          type: integer
          description: Candidates marked hired in the current calendar month (S3)

    EmployerDashboard:
      type: object
      required: [kpis, recentJobs, recentApplicants, profileChecklist]
      description: |
        Employer dashboard summary (Screen 15).

        As of Sprint 4, `recentApplicants` is LIVE — the most recent applicants
        across the employer's jobs, each an `ApplicantSummary` carrying
        employer-context privacy masking (no phone/religion/dob). It was an honest
        `[]` in S3. An empty array now means genuinely no applicants yet.

        `profileChecklist` is computed per-request from current company state —
        never stored as a percentage. Use its `hint` field to surface the next
        actionable item to the employer.
      properties:
        kpis:
          $ref: '#/components/schemas/EmployerDashboardKpi'
        recentJobs:
          type: array
          items:
            $ref: '#/components/schemas/JobCard'
        recentApplicants:
          type: array
          description: Most recent applicants across the employer's jobs (live in S4).
          items:
            $ref: '#/components/schemas/ApplicantSummary'
        profileChecklist:
          $ref: '#/components/schemas/ProfileChecklist'

    # ── Job schemas (S2) ────────────────────────────────────────────────────────
    Job:
      type: object
      required:
        [
          id,
          title,
          status,
          market,
          location,
          salaryCurrency,
          accommodation,
          healthInsurance,
          transportation,
          companyId,
          companyName,
          createdAt,
        ]
      description: |
        Full internal job schema — returned to the owning employer and admins only.
        **Never return this schema on public endpoints** — use `JobCard` or `JobDetail`.

        **Publish-time enforcement order** (documented here, enforced at `POST /jobs/{id}/publish`):
        1. `EMPLOYER_NOT_APPROVED` (403) — company.status must be APPROVED.
        2. `WORKER_PROTECTION_VIOLATION` (422) — accommodation, healthInsurance, and
           transportation must all be true. `meta.violations[]` lists which failed.
        3. `JOB_QUOTA_EXCEEDED` (422) — quota = the plan's `maxActiveJobs`
           (S5): Free 1, Pro unlimited. `meta.planLimit` reflects the plan.
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        status:
          $ref: '#/components/schemas/JobStatus'
        market:
          $ref: '#/components/schemas/JobMarket'
        location:
          type: string
        description:
          type: string
          minLength: 300
          description: >
            At least 300 characters — roughly three sentences. Enforced on
            create AND update, so an edit cannot whittle a description back
            below the bar it originally had to clear.
        contractDuration:
          oneOf:
            - $ref: '#/components/schemas/ContractDuration'
            - type: 'null'
          description: Null unless `employmentType` is CONTRACT.
        termsVersion:
          type: [string, 'null']
          description: >
            Which version of the job-posting terms this job was posted under.
            Null for jobs posted before the terms existed — deliberately not
            backfilled, because stamping a version onto them would fabricate an
            acceptance that never happened.
        termsAcceptedAt:
          type: [string, 'null']
          format: date-time
          description: Server-side timestamp of acceptance, never client-reported.
        categoryId:
          type: [string, 'null']
          format: uuid
        categoryOther:
          type: [string, 'null']
          maxLength: 80
          description: >
            Free-text trade name. Set ONLY when `categoryId` is the `other`
            category; null/absent for every fixed trade. Required when that
            category is chosen (400 `CATEGORY_OTHER_REQUIRED`) and rejected
            otherwise (400 `CATEGORY_OTHER_NOT_ALLOWED`).
        salaryMin:
          type: [integer, 'null']
          minimum: 0
        salaryMax:
          type: [integer, 'null']
          minimum: 0
        salaryCurrency:
          type: string
          example: AED
        accommodation:
          type: boolean
          description: Must be true to publish — worker-protection rule enforced at publish time
        healthInsurance:
          type: boolean
          description: Must be true to publish — worker-protection rule enforced at publish time
        transportation:
          type: boolean
          description: Must be true to publish — worker-protection rule enforced at publish time
        workConditions:
          type: string
        requirements:
          type: array
          items:
            type: string
        experienceRequiredYears:
          type: [integer, 'null']
          minimum: 0
        vacancies:
          type: [integer, 'null']
          minimum: 1
        genderPreference:
          $ref: '#/components/schemas/GenderPreference'
        companyId:
          type: string
          format: uuid
          description: Internal — not returned on public endpoints
        companyName:
          type: string
          description: Denormalized for display
        applicantCount:
          type: integer
          minimum: 0
          description: >
            Total applications to this job. Live in Sprint 4 — powers the
            applicant count on the employer's My Jobs list (Screen 17), the entry
            point to the applicants view (Screen 18). Omitted before S4.
        createdAt:
          type: string
          format: date-time
        publishedAt:
          type: [string, 'null']
          format: date-time
        archivedAt:
          type: [string, 'null']
          format: date-time

    JobCard:
      type: object
      required:
        [
          id,
          title,
          market,
          location,
          salaryCurrency,
          accommodation,
          healthInsurance,
          transportation,
          companyName,
          createdAt,
        ]
      description: |
        **Public search-result shape.** Deliberately excludes internal employer fields
        (`companyId`, employer PII, internal metadata). Only ACTIVE jobs appear in
        public feeds (`GET /jobs`).

        `isSaved` is populated for authenticated candidate callers; `null` for
        unauthenticated (SSR / crawler) requests.
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        market:
          $ref: '#/components/schemas/JobMarket'
        country:
          type: [string, 'null']
          description: >
            Recruiting country (canonical English name, e.g. "India", "United Arab
            Emirates"). null on jobs created before the field existed.
          example: United Arab Emirates
        location:
          type: string
        categoryId:
          type: [string, 'null']
          format: uuid
        categoryOther:
          type: [string, 'null']
          maxLength: 80
          description: >
            Free-text trade name. Set ONLY when `categoryId` is the `other`
            category; null/absent for every fixed trade. Required when that
            category is chosen (400 `CATEGORY_OTHER_REQUIRED`) and rejected
            otherwise (400 `CATEGORY_OTHER_NOT_ALLOWED`).
        salaryMin:
          type: [integer, 'null']
          minimum: 0
        salaryMax:
          type: [integer, 'null']
          minimum: 0
        salaryCurrency:
          type: string
          example: AED
        accommodation:
          type: boolean
        healthInsurance:
          type: boolean
        transportation:
          type: boolean
        companyName:
          type: string
        createdAt:
          type: string
          format: date-time
        publishedAt:
          type: [string, 'null']
          format: date-time
        isSaved:
          type: [boolean, 'null']
          description: >
            Whether the authenticated candidate has saved this job.
            null for unauthenticated callers.

    JobDetail:
      allOf:
        - $ref: '#/components/schemas/JobCard'
        - type: object
          description: |
            **Public job detail page.** Extends `JobCard` with full description,
            requirements, work conditions, and up to 5 similar jobs.
            No `companyId` or other internal/employer-PII fields.
          properties:
            description:
              type: string
            requirements:
              type: array
              items:
                type: string
            workConditions:
              type: string
            experienceRequiredYears:
              type: [integer, 'null']
              minimum: 0
            vacancies:
              type: [integer, 'null']
              minimum: 1
            genderPreference:
              $ref: '#/components/schemas/GenderPreference'
            similarJobs:
              type: array
              items:
                $ref: '#/components/schemas/JobCard'
              description: Up to 5 similar active jobs in the same market/category.

    # ── Notification schemas (S2) ───────────────────────────────────────────────
    Notification:
      type: object
      required: [id, type, title, body, read, createdAt]
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/NotificationType'
        title:
          type: string
        body:
          type: string
        read:
          type: boolean
        readAt:
          type: [string, 'null']
          format: date-time
        relatedEntityId:
          type: string
          description: ID of the related job or application (if applicable)
        relatedEntityType:
          type: string
          enum: [job, application]
        createdAt:
          type: string
          format: date-time

    # ── Settings schemas (S2) ───────────────────────────────────────────────────
    AdminPlan:
      type: object
      description: >
        A subscription plan as the admin console edits it. Distinct from the
        employer-facing plan DTO: this one carries `isActive` and `priceEditable`,
        which are operator concerns and never shown to a buyer.
      required: [code, name, priceSubunits, period, maxActiveJobs, isActive, priceEditable]
      properties:
        code:
          type: string
          example: PRO_MONTHLY
        name:
          type: string
          example: Pro Monthly
        priceSubunits:
          type: integer
          description: Price in paise. 299900 = 2,999.00.
          example: 299900
        period:
          type: string
          nullable: true
          enum: [MONTHLY, YEARLY]
        maxActiveJobs:
          type: integer
          nullable: true
          description: Null means unlimited.
        isActive:
          type: boolean
          description: False takes the plan off sale without deleting it.
        priceEditable:
          type: boolean
          description: >
            False for the zero-priced Free plan, whose price is structural —
            checkout uses `priceSubunits === 0` to decide purchasability, so it
            must stay at zero. The console disables the input rather than letting
            an admin discover the rule through a 422.
    Setting:
      type: object
      required: [key, value, isCoreRule, updatedAt]
      description: |
        Platform configuration setting — EXACTLY the persisted row, no
        presentation metadata.

        CORRECTED IN S6a-F2: this schema was frozen (S6-0) with `group`, `label`
        and `description` fields and SCREAMING_CASE keys (`REQUIRE_ACCOMMODATION`)
        that the real API has never returned — S2-B1 deliberately keeps labels and
        grouping OUT of the server, because they are localizable UI copy. The real
        wire shape is the flat row below, with dot-prefixed keys
        (`worker_protection.accommodation_required`, `jobs.auto_archive_days`,
        `candidates.min_completion_pct`, `payments.gst_rate_pct`, …).

        The client derives everything presentational:
        - GROUPING (Screen 28's tabs) from the key prefix — `worker_protection.*`
          / `jobs.*` / `candidates.*` / `payments.*`.
        - LABELS and descriptions from its own i18n bundle, keyed by setting key.
        - The EDITOR TYPE from the runtime type of `value` (boolean → toggle,
          number → numeric field, array → list editor).

        `isCoreRule = true` (the worker-protection trio) may only be updated by
        SUPER_ADMIN — other callers receive 403 `CORE_RULE_FORBIDDEN` per key.
      properties:
        id:
          type: string
          format: uuid
        key:
          type: string
          description: Machine-readable unique key (e.g. worker_protection.accommodation_required)
        value:
          description: >
            The current value. Type varies by key: boolean for flags, number for
            numeric limits, string[] for lists (e.g. candidates.mandatory_documents).
        isCoreRule:
          type: boolean
          description: If true, only SUPER_ADMIN may update this setting
        version:
          type: integer
          description: Bumped on every write (optimistic-concurrency seam)
        updatedAt:
          type: string
          format: date-time
        updatedById:
          type: [string, 'null']
          description: User ID of the last updater (null when never edited)

    # ── Employer profile schemas (S3) ──────────────────────────────────────────
    ProfileChecklist:
      type: object
      required: [hasLogo, hasHiringPreferences, hasSecondContact, hasDescription, hint]
      description: |
        Employer profile completeness checklist — computed per-request from current
        company state. No stored percentage; no scoring engine.
        `hint` is the next actionable item (null when all checks pass).
      properties:
        hasLogo:
          type: boolean
          description: Company logo has been uploaded and confirmed
        hasHiringPreferences:
          type: boolean
          description: Hiring preferences have been saved at least once
        hasSecondContact:
          type: boolean
          description: At least two contact persons are recorded
        hasDescription:
          type: boolean
          description: Company description field is non-empty
        hint:
          type: [string, 'null']
          description: Next actionable item for the employer; null when all checks pass
          example: 'Add a company logo to build candidate trust'

    HiringPreferences:
      type: object
      description: Employer hiring preferences used for candidate browse context
      properties:
        preferredCategories:
          type: array
          items:
            type: string
            format: uuid
          description: Category IDs the employer prefers to hire from
        preferredNationalities:
          type: array
          items:
            type: string
          description: Preferred candidate nationalities (e.g. 'Indian', 'Nepali')
        minExperience:
          type: integer
          minimum: 0
          description: Minimum years of experience preferred
        notes:
          type: string
          description: Free-text hiring notes (internal, not shown to candidates)

    ContactPerson:
      type: object
      required: [id, name, role, isPrimary, createdAt]
      description: |
        Display-only contact record for employer profile.
        **NOT a login account** — these are human contacts listed on the company
        profile (e.g., HR Manager, Recruitment Lead) so candidates and admins
        know who to reach. Creating a contact does NOT create a user account.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Rajesh Mehta
        role:
          type: string
          example: HR Manager
        phone:
          type: string
          example: '+971501234567'
        email:
          type: string
          format: email
          example: rajesh@gulfbuilders.example.com
        isPrimary:
          type: boolean
          description: >
            Only one contact per company may be primary. Setting a new contact
            as primary auto-demotes the existing primary.
        createdAt:
          type: string
          format: date-time

    EmployerProfile:
      type: object
      required: [company, contacts, profileChecklist]
      description: >
        Full employer profile returned by GET /employers/me/profile.
        Includes company details, hiring preferences, contact persons, logo URL,
        and the computed profile completeness checklist.
      properties:
        company:
          $ref: '#/components/schemas/Company'
        hiringPreferences:
          $ref: '#/components/schemas/HiringPreferences'
          description: null when not yet saved
        contacts:
          type: array
          items:
            $ref: '#/components/schemas/ContactPerson'
        logoUrl:
          type: [string, 'null']
          format: uri
          description: Short-expiry signed R2 URL; null if no logo uploaded
        profileChecklist:
          $ref: '#/components/schemas/ProfileChecklist'

    # ── Candidate employer-view schemas (S3) ────────────────────────────────────
    CandidateDocumentStatus:
      type: object
      required: [type, uploaded]
      description: |
        Document status indicator visible in employer context.
        **NEVER includes keys, URLs, or document content.**
        Signed-URL access (for download) is S5 Pro-gated.
      properties:
        type:
          $ref: '#/components/schemas/DocumentType'
        uploaded:
          type: boolean
          description: Whether the candidate has uploaded this document type
        passportValid:
          type: boolean
          description: >
            PASSPORT type only. true = passport exists and is not expired.
            Absent for non-PASSPORT types.

    CandidateEmployerView:
      type: object
      required: [id, fullName, isAvailable, documentsStatus, memberSince]
      description: |
        Employer-context view of a candidate profile. Privacy invariants:
        - `phone` is **ABSENT** (not null) when `showPhone = false`
        - `religion` is **ABSENT** (not null) when `showReligion = false`
        - `dob` is NEVER included — only derived `age` (integer years)
        - `documentsStatus` contains status/validity ONLY — no keys, URLs, or content
        - A `profileVisible = false` candidate returns 404 (indistinguishable from
          nonexistent) — NEVER appears here
      properties:
        id:
          type: string
          format: uuid
        fullName:
          type: string
        age:
          type: integer
          minimum: 0
          description: Age in full years derived from dob — never raw dob
        phone:
          type: string
          description: ABSENT when showPhone = false; present when showPhone = true
          example: '+919876543210'
        religion:
          type: string
          description: ABSENT when showReligion = false (default); present when showReligion = true
        isInterested:
          type: boolean
          description: >-
            Whether the VIEWING company has shortlisted this candidate. Viewer-relative,
            like isSaved on JobCard — it says nothing about other employers.
        interestNotified:
          type: boolean
          description: >-
            Whether the viewing company has already sent this candidate the
            "we are interested" message. The server allows that only once.
        nationality:
          type: string
        currentLocation:
          type: string
        jobCategoryId:
          type: [string, 'null']
          format: uuid
        isAvailable:
          type: boolean
        noticePeriod:
          type: integer
          description: Notice period in days
        languages:
          type: array
          items:
            type: string
        experiences:
          type: array
          items:
            $ref: '#/components/schemas/WorkExperience'
        skills:
          type: array
          items:
            $ref: '#/components/schemas/CandidateSkill'
        documentsStatus:
          type: array
          items:
            $ref: '#/components/schemas/CandidateDocumentStatus'
        memberSince:
          type: string
          format: date-time
          description: >-
            When the candidate joined, rendered as "member since". Named
            memberSince — NOT createdAt — because that is what the API emits;
            the contract said createdAt for a while and the UI dutifully read a
            field that was always undefined, crashing the page on Invalid Date.

    CandidateBrowseCard:
      type: object
      required: [id, fullName, isAvailable, hasForeignExperience]
      description: |
        Card-level candidate summary for employer browse (GET /employers/candidates).
        Deliberately minimal — no phone, religion, salary, or documents.
        All `profileVisible = false` candidates are excluded at query time
        (never appear in browse results).
      properties:
        id:
          type: string
          format: uuid
        fullName:
          type: string
        nationality:
          type: string
        currentLocation:
          type: string
        jobCategoryId:
          type: [string, 'null']
          format: uuid
        experienceYears:
          type: integer
          minimum: 0
          description: Total years of experience across all work entries
        skills:
          type: array
          items:
            type: string
          maxItems: 3
          description: Up to 3 skill names for display (full list on detail view)
        hasForeignExperience:
          type: boolean
          description: true if any work experience has type = FOREIGN
        isAvailable:
          type: boolean
          description: >-
            What the candidate DECLARES — a toggle they set and may never
            revisit. Read it alongside `activityStatus`, never instead of it.
        activityStatus:
          $ref: '#/components/schemas/CandidateActivityStatus'
        completionPct:
          type: integer
          description: Stored profile-completion percentage (0-100).

    # ── Profile view analytics schema (S3) ─────────────────────────────────────
    ProfileViewsSummary:
      type: object
      required: [total, last30Days, recentViews]
      description: Profile view analytics returned to the authenticated candidate
      properties:
        total:
          type: integer
          description: All-time total profile views
        last30Days:
          type: integer
          description: Profile views in the last 30 days
        recentViews:
          type: array
          description: Most recent individual view events (newest first, max 20)
          items:
            type: object
            required: [companyName, viewedAt]
            properties:
              companyName:
                type: string
                description: Name of the company that viewed the profile
              viewedAt:
                type: string
                format: date-time

    # ── Application schemas (S4) ───────────────────────────────────────────────
    ApplicationStatus:
      type: string
      enum: [PENDING, SHORTLISTED, SELECTED, REJECTED]
      description: >
        Application lifecycle status. There is NO `WITHDRAWN` state at MVP —
        candidates cannot withdraw an application (deliberately out of scope; a
        later sprint may add it). Employer transitions are forward-only
        (PENDING → SHORTLISTED → SELECTED|REJECTED); only admins may move
        backward/corrective, and only with a mandatory override reason.

    MatchBreakdown:
      type: object
      required: [category, experienceYears, foreignExperience, documents]
      description: >
        Per-factor breakdown of `matchScore`, SNAPSHOTTED at apply time and
        NEVER recomputed on later reads or status changes. The four factor
        scores sum to `matchScore` (0–100). Max weights: category 40,
        experienceYears 30, foreignExperience 20, documents 10.
      properties:
        category:
          type: object
          required: [score, max]
          description: 40 when the job category matches the candidate's category, else 0.
          properties:
            score: { type: integer, minimum: 0, maximum: 40 }
            max: { type: integer, example: 40 }
        experienceYears:
          type: object
          required: [raw, clamped, score, max]
          description: Scales with clamped years of experience.
          properties:
            raw:
              type: integer
              minimum: 0
              description: Candidate's total years of experience at apply time (unclamped).
            clamped:
              type: integer
              minimum: 0
              description: '`raw` clamped to the scoring ceiling before scoring.'
            score: { type: integer, minimum: 0, maximum: 30 }
            max: { type: integer, example: 30 }
        foreignExperience:
          type: object
          required: [score, max]
          description: 20 when any work experience has type FOREIGN, else 0.
          properties:
            score: { type: integer, minimum: 0, maximum: 20 }
            max: { type: integer, example: 20 }
        documents:
          type: object
          required: [score, max]
          description: Scales with the count of mandatory documents present at apply.
          properties:
            score: { type: integer, minimum: 0, maximum: 10 }
            max: { type: integer, example: 10 }

    Application:
      type: object
      required:
        [
          id,
          humanId,
          jobId,
          candidateId,
          status,
          matchScore,
          matchBreakdown,
          docsCompleteCount,
          docsRequiredCount,
          passportValidAtApply,
          appliedAt,
        ]
      description: >
        A candidate's application to a job. `matchScore` (0–100) and
        `matchBreakdown` are computed ONCE at apply time and snapshotted —
        NEVER recomputed on later reads or status changes. The snapshot fields
        (`docsCompleteCount` / `docsRequiredCount` / `passportValidAtApply`)
        freeze the gate state at apply time. `humanId` is DB-assigned in the
        format `AP-YYYY-N`.
      properties:
        id:
          type: string
          format: uuid
        humanId:
          type: string
          example: AP-2026-1
          description: DB-assigned human id, format `AP-YYYY-N`.
        jobId:
          type: string
          format: uuid
        candidateId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/ApplicationStatus'
        matchScore:
          type: integer
          minimum: 0
          maximum: 100
          description: Snapshot at apply time — never recomputed.
        matchBreakdown:
          $ref: '#/components/schemas/MatchBreakdown'
        coverLetter:
          type: [string, 'null']
          maxLength: 500
        docsCompleteCount:
          type: integer
          description: Mandatory documents present at apply time (snapshot).
        docsRequiredCount:
          type: integer
          description: Mandatory documents required at apply time (snapshot).
        passportValidAtApply:
          type: boolean
          description: Passport present and unexpired at apply time (snapshot).
        selectedNotifiedAt:
          type: [string, 'null']
          format: date-time
          description: >
            Set the FIRST time the application enters SELECTED — guards the
            once-per-application "Selected" WhatsApp. Re-entry to SELECTED does
            NOT change it (email + in-app only on re-entry).
        rejectionFeedback:
          type: [string, 'null']
          description: Optional employer feedback surfaced to the candidate on rejection.
        overrideReason:
          type: [string, 'null']
          description: >
            Reason for the most recent admin corrective (override) move.
            ADMIN CONTEXT ONLY — present only in admin serializations; never
            emitted to candidate or employer contexts.
        appliedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ApplicationCard:
      type: object
      required: [id, humanId, job, status, matchScore, appliedAt]
      description: >
        Candidate-facing application list item (GET /candidates/me/applications).
      properties:
        id:
          type: string
          format: uuid
        humanId:
          type: string
          example: AP-2026-1
        job:
          type: object
          required: [id, title, companyName, location, market]
          description: Minimal job subset for the applications list.
          properties:
            id:
              type: string
              format: uuid
            title:
              type: string
            companyName:
              type: string
            location:
              type: string
            market:
              $ref: '#/components/schemas/JobMarket'
        status:
          $ref: '#/components/schemas/ApplicationStatus'
        matchScore:
          type: integer
          minimum: 0
          maximum: 100
        appliedAt:
          type: string
          format: date-time
        selectedNotifiedAt:
          type: [string, 'null']
          format: date-time
          description: Non-null drives the "WhatsApp receipt sent" indicator on the card.
        rejectionFeedback:
          type: [string, 'null']

    ApplicationTimelineEntry:
      type: object
      required: [fromStatus, toStatus, actorRole, isAdminOverride, createdAt]
      description: >
        One status transition in an application's history. Carries the actor's
        ROLE only — NEVER actor identity. `overrideReason` is admin/audit-facing
        and is DELIBERATELY EXCLUDED from the candidate-facing timeline (see
        GET /candidates/me/applications/{id}).
      properties:
        fromStatus:
          $ref: '#/components/schemas/ApplicationStatus'
        toStatus:
          $ref: '#/components/schemas/ApplicationStatus'
        actorRole:
          $ref: '#/components/schemas/UserRole'
        isAdminOverride:
          type: boolean
          description: true when an admin made a non-forward-only (corrective) move.
        createdAt:
          type: string
          format: date-time

    ApplicationDetail:
      allOf:
        - $ref: '#/components/schemas/ApplicationCard'
        - type: object
          required: [matchBreakdown, coverLetter, timeline]
          description: >
            Candidate-facing application detail. Adds the match breakdown, the
            candidate's cover letter, and the status `timeline`. The timeline
            excludes `overrideReason` (admin/audit-only).
          properties:
            matchBreakdown:
              $ref: '#/components/schemas/MatchBreakdown'
            coverLetter:
              type: [string, 'null']
              maxLength: 500
            timeline:
              type: array
              items:
                $ref: '#/components/schemas/ApplicationTimelineEntry'

    ApplicantCard:
      allOf:
        - $ref: '#/components/schemas/CandidateEmployerView'
        - type: object
          required:
            [applicationId, humanId, status, matchScore, matchBreakdown, appliedAt]
          description: >
            An applicant to a job (GET /jobs/{id}/applicants). Combines the S3
            employer-context candidate subset (INHERITING all its privacy
            omission semantics — phone/religion omitted per the candidate's
            toggles, no dob, documents status-only) with the application's own
            fields. The candidate subset is `$ref`'d, never forked — one privacy
            contract. `id` (inherited) is the candidate id; `applicationId` is
            the application.
          properties:
            applicationId:
              type: string
              format: uuid
            humanId:
              type: string
              example: AP-2026-1
            status:
              $ref: '#/components/schemas/ApplicationStatus'
            matchScore:
              type: integer
              minimum: 0
              maximum: 100
            matchBreakdown:
              $ref: '#/components/schemas/MatchBreakdown'
            coverLetter:
              type: [string, 'null']
              maxLength: 500
            appliedAt:
              type: string
              format: date-time
            docsCompleteCount:
              type: integer
            docsRequiredCount:
              type: integer
            passportValidAtApply:
              type: boolean

    ApplicantCounts:
      type: object
      required: [pending, shortlisted, selected, rejected]
      description: Per-status applicant counts — powers Screen 18's column headers.
      properties:
        pending:
          type: integer
        shortlisted:
          type: integer
        selected:
          type: integer
        rejected:
          type: integer

    ApplicantSummary:
      type: object
      required: [applicationId, candidateId, candidateName, jobId, jobTitle, status, matchScore, appliedAt]
      description: >
        Compact applicant row for the employer dashboard's `recentApplicants`.
        Employer-context: applies the candidate privacy omission semantics
        (no phone / religion / dob).
      properties:
        applicationId:
          type: string
          format: uuid
        candidateId:
          type: string
          format: uuid
        candidateName:
          type: string
        jobId:
          type: string
          format: uuid
        jobTitle:
          type: string
        status:
          $ref: '#/components/schemas/ApplicationStatus'
        matchScore:
          type: integer
          minimum: 0
          maximum: 100
        appliedAt:
          type: string
          format: date-time

    # ── S5: Billing ─────────────────────────────────────────────────────────────
    # MONEY DISCIPLINE (locked): every monetary amount in this contract is an
    # INTEGER count of currency subunits (paise for INR, cents for USD/AED) in a
    # field named `*Subunits`, paired with a `currency` ISO-4217 code. A float
    # money field anywhere in a schema is a contract defect.

    PlanCode:
      type: string
      enum: [FREE, PRO_MONTHLY, PRO_YEARLY]
      description: The seeded three plans. FREE is never purchasable via checkout.

    PaymentGateway:
      type: string
      enum: [RAZORPAY, STRIPE]
      description: >
        Chosen SERVER-SIDE at checkout — the client never selects or sends a
        gateway. Routing rule: LOCAL companies → Razorpay domestic (INR + GST);
        FOREIGN companies → Razorpay International primary, Stripe only when the
        `payments.stripe_enabled` platform setting is on.

    OrderStatus:
      type: string
      enum: [CREATED, PAID, FAILED, EXPIRED]
      description: >
        CREATED → PAID/FAILED is driven EXCLUSIVELY by the verified gateway
        webhook (or admin reconciliation). The client success callback never
        flips an order. EXPIRED = never completed within the gateway window.

    SubscriptionState:
      type: string
      enum: [ACTIVE, GRACE, EXPIRED]
      description: >
        ACTIVE until `expiresAt`; then a 7-day GRACE window (`graceEndsAt`)
        during which everything keeps working and renewal banners show; after
        grace, EXPIRED — all the company's ACTIVE jobs EXCEPT the most recently
        published one are paused (Answer 07), returning the company to
        Free-plan behavior. The FREE plan is always a well-formed ACTIVE state
        with `expiresAt: null` — never an error.

    Plan:
      type: object
      required: [code, name, priceSubunits, currency, period, maxActiveJobs, features]
      description: >
        A purchasable (or the free) subscription plan. `priceSubunits` is the
        base price EXCLUDING GST. For LOCAL (Indian) companies the UI displays
        price + GST — `gstRatePct` here is a DISPLAY HINT ONLY; the checkout
        response's `gstSubunits` split is the authoritative figure (server
        computed, never derived client-side).
      properties:
        code:
          $ref: '#/components/schemas/PlanCode'
        name:
          type: string
          example: Pro Monthly
        priceSubunits:
          type: integer
          minimum: 0
          description: Base price in integer subunits, EXCLUDING GST (FREE = 0).
          example: 299900
        currency:
          type: string
          description: ISO-4217 code the price is denominated in.
          example: INR
        period:
          type: [string, 'null']
          enum: [MONTHLY, YEARLY, null]
          description: Billing period; null for FREE (never expires).
        maxActiveJobs:
          type: [integer, 'null']
          description: >
            Concurrent ACTIVE-job quota enforced at publish
            (`JOB_QUOTA_EXCEEDED`, meta.planLimit). null = unlimited.
          example: 1
        gstRatePct:
          type: integer
          description: >
            GST rate hint for LOCAL-company price display (e.g. 18). The
            checkout response carries the authoritative split.
          example: 18
        features:
          type: array
          items:
            type: string
          description: Marketing feature strings for the plan card.

    SubscriptionStatus:
      type: object
      required: [plan, status, startsAt, expiresAt, daysRemaining, renewable]
      description: >
        The company's current subscription — the PlanStatusWidget + subscription
        page source. A company that never purchased anything gets a well-formed
        FREE state (status ACTIVE, expiresAt null) — NOT a 404.


        **Renewal-window semantics:** renewal of the SAME plan EXTENDS the
        current term (new expiry = current `expiresAt` + one period — paid time
        is never lost). `renewable` turns true inside the renewal window (the
        last 7 days before `expiresAt`) and stays true through GRACE and
        EXPIRED. Attempting a same-plan checkout while `renewable` is false →
        409 `SUBSCRIPTION_ALREADY_ACTIVE`. A DIFFERENT paid plan may be
        purchased at any time (an upgrade replaces the term).


        **Grace semantics (Answer 07):** after `expiresAt` the status becomes
        GRACE for 7 days (`graceEndsAt`). After grace, EXPIRED: all the
        company's ACTIVE jobs except the most recently published one are
        paused, and quota enforcement returns to the FREE limit.
      properties:
        plan:
          $ref: '#/components/schemas/Plan'
        status:
          $ref: '#/components/schemas/SubscriptionState'
        startsAt:
          type: string
          format: date-time
        expiresAt:
          type: [string, 'null']
          format: date-time
          description: null for FREE (never expires).
        graceEndsAt:
          type: [string, 'null']
          format: date-time
          description: Present (non-null) only while status = GRACE.
        daysRemaining:
          type: [integer, 'null']
          description: >
            Whole days until `expiresAt` (during ACTIVE) or until `graceEndsAt`
            (during GRACE); 0 when EXPIRED; null for FREE.
        renewable:
          type: boolean
          description: >
            True when a same-plan renewal checkout is currently allowed (inside
            the renewal window, or in GRACE/EXPIRED). False → same-plan checkout
            returns 409 SUBSCRIPTION_ALREADY_ACTIVE.

    Invoice:
      type: object
      required: [id, number, issuedAt, totalSubunits, currency, planName, pdfUrl]
      description: >
        A GST-compliant invoice, generated when the webhook confirms payment.
        `number` is SEQUENTIAL per calendar year in the format
        `SIC-YYYY-NNNNN` (e.g. `SIC-2026-00042`) — gapless, assigned at
        generation time, never reused.
      properties:
        id:
          type: string
          format: uuid
        number:
          type: string
          pattern: '^SIC-\d{4}-\d{5}$'
          example: SIC-2026-00042
        issuedAt:
          type: string
          format: date-time
        totalSubunits:
          type: integer
          minimum: 0
          description: Grand total INCLUDING GST, integer subunits.
        currency:
          type: string
          example: INR
        planName:
          type: string
          example: Pro Monthly
        pdfUrl:
          type: [string, 'null']
          description: >
            SHORT-EXPIRY signed URL (~15 minutes) to the invoice PDF — minted
            fresh on every list/detail read, so a stale URL is cured by
            refetching the invoice list. null until the PDF has been generated
            (generation is async, worker-side).

    CheckoutSession:
      type: object
      required: [orderId, gateway, amountSubunits, gstSubunits, totalSubunits, currency]
      description: >
        The checkout response — tells the frontend WHICH gateway to launch and
        with what payload. EXACTLY ONE of `razorpay` / `stripe` is present, and
        it always matches `gateway`; the frontend branches on `gateway`, it
        never chooses. `gstSubunits` is the authoritative GST split (0 for
        FOREIGN companies; server-computed for LOCAL).


        **Activation is webhook-only:** completing the gateway flow does NOT
        activate anything. The frontend must poll `GET /billing/orders/{id}`
        until the (signature-verified) webhook flips the order to PAID — or
        surface a "still confirming" timeout UX. A client-side success callback
        NEVER changes order or subscription state.
      properties:
        orderId:
          type: string
          format: uuid
          description: The poll target — `GET /billing/orders/{orderId}`.
        humanOrderRef:
          type: string
          description: Human-readable order reference (support conversations).
          example: ORD-2026-00107
        gateway:
          $ref: '#/components/schemas/PaymentGateway'
        amountSubunits:
          type: integer
          minimum: 0
          description: Base amount excluding GST, integer subunits.
        gstSubunits:
          type: integer
          minimum: 0
          description: GST portion, integer subunits (0 when not applicable).
        totalSubunits:
          type: integer
          minimum: 0
          description: amountSubunits + gstSubunits — what the gateway charges.
        currency:
          type: string
          example: INR
        razorpay:
          type: object
          required: [keyId, gatewayOrderId]
          description: Present iff gateway = RAZORPAY.
          properties:
            keyId:
              type: string
              description: Publishable Razorpay key id for Checkout.js.
            gatewayOrderId:
              type: string
              description: The Razorpay order id to open Checkout.js with.
        stripe:
          type: object
          required: [redirectUrl]
          description: Present iff gateway = STRIPE.
          properties:
            redirectUrl:
              type: string
              description: Stripe-hosted Checkout URL to redirect the browser to.

    Order:
      type: object
      required:
        [id, planCode, status, gateway, amountSubunits, gstSubunits, totalSubunits,
         currency, createdAt, subscriptionActivatedAt, invoiceId]
      description: >
        A checkout order — THE poll target after the gateway flow. Status moves
        CREATED → PAID/FAILED only via the verified webhook (or admin
        reconciliation); polling this endpoint is safe and side-effect-free.
        On PAID, `subscriptionActivatedAt` and `invoiceId` are set by the same
        webhook-driven transaction.
      properties:
        id:
          type: string
          format: uuid
        humanOrderRef:
          type: string
          example: ORD-2026-00107
        planCode:
          $ref: '#/components/schemas/PlanCode'
        status:
          $ref: '#/components/schemas/OrderStatus'
        gateway:
          $ref: '#/components/schemas/PaymentGateway'
        amountSubunits:
          type: integer
          minimum: 0
        gstSubunits:
          type: integer
          minimum: 0
        totalSubunits:
          type: integer
          minimum: 0
        currency:
          type: string
          example: INR
        createdAt:
          type: string
          format: date-time
        subscriptionActivatedAt:
          type: [string, 'null']
          format: date-time
          description: Set when the webhook activates the subscription (PAID only).
        invoiceId:
          type: [string, 'null']
          format: uuid
          description: Set when the invoice is generated (PAID only).

    DocumentUrlGrant:
      type: object
      required: [url, expiresInSeconds]
      description: >
        A short-expiry signed R2 GET URL for a candidate document (Pro-plan
        employer feature). EVERY issuance is written to the audit log
        (who / which candidate / which document type / when) — the URL itself
        and the object key are never logged.
      properties:
        url:
          type: string
          description: Signed R2 GET URL. Fetch immediately; do not persist.
        expiresInSeconds:
          type: integer
          description: Seconds until the signed URL stops working (short — e.g. 300).
          example: 300

    JobCreateRequest:
      type: object
      required:
        [
          title,
          market,
          location,
          description,
          salaryCurrency,
          accommodation,
          healthInsurance,
          transportation,
          acceptedTermsVersion,
        ]
      properties:
        title:
          type: string
        market:
          $ref: '#/components/schemas/JobMarket'
        location:
          type: string
        description:
          type: string
          minLength: 300
          description: >
            At least 300 characters — roughly three sentences. Enforced at
            CREATE (not only at publish) so a thin description is reported
            against the field while the employer is still on the form.
        contractDuration:
          $ref: '#/components/schemas/ContractDuration'
        acceptedTermsVersion:
          type: string
          example: 2026-08-draft-1
          description: >
            The VERSION of the job-posting terms the employer accepted. A
            version, not a boolean: the question in a dispute is what was agreed
            to, which a bare `true` cannot answer. Must be one of the published
            versions — any published version is accepted, not only the current
            one, so a form loaded just before a terms update does not fail on
            submit. The server stamps it onto the job with its own timestamp.
        categoryId:
          type: string
          format: uuid
        categoryOther:
          type: string
          maxLength: 80
          description: >
            Free-text trade name. Set ONLY when `categoryId` is the `other`
            category; null/absent for every fixed trade. Required when that
            category is chosen (400 `CATEGORY_OTHER_REQUIRED`) and rejected
            otherwise (400 `CATEGORY_OTHER_NOT_ALLOWED`).
        salaryMin:
          type: integer
          minimum: 0
        salaryMax:
          type: integer
          minimum: 0
        salaryCurrency:
          type: string
          example: AED
        accommodation:
          type: boolean
        healthInsurance:
          type: boolean
        transportation:
          type: boolean
        workConditions:
          type: string
        requirements:
          type: array
          items:
            type: string
        experienceRequiredYears:
          type: integer
          minimum: 0
        vacancies:
          type: integer
          minimum: 1
        genderPreference:
          $ref: '#/components/schemas/GenderPreference'

    # ══════════════════════════════════════════════════════════════════════════
    # S6 — ADMIN CONSOLE
    #
    # The admin console is EN-ONLY (locked decision 2): i18n keys still exist so
    # it can be translated later, but no HI/AR fixtures and no RTL obligations
    # apply to admin screens.
    #
    # RBAC: every admin endpoint declares the PermissionKey it requires. Denial
    # is 403 FORBIDDEN (`meta.requiredPermission`). Permissions are DATA
    # (role_permissions rows), not hardcoded roles — a role's effective set is
    # what the matrix says, so "SUPER_ADMIN-effective" below means "seeded ON for
    # SUPER_ADMIN and locked OFF for everyone else", not a role check in code.
    # ══════════════════════════════════════════════════════════════════════════

    OffsetMeta:
      type: object
      required: [page, pageSize, total, totalPages]
      description: The standard offset-pagination envelope used by every admin table.
      properties:
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer

    AuditStatus:
      type: string
      enum: [SUCCESS, FAILED, BLOCKED, DELIVERED, ERROR]
      description: Outcome recorded on an audit row.

    PermissionKey:
      type: string
      description: |
        The RBAC permission keys (Screen 27). The first 20 are the S2-seeded set;
        5 were added by S6 (`logs.export`, `roles.view`, `roles.manage`,
        `candidates.view_documents`, `jobs.moderate`) and seeded by S6a-B2; and 2
        more (`settings.view`, `settings.manage`) by S6a-F1.

        The settings pair retires a placeholder: S2-B1 gated `/admin/settings` on
        `logs.view` because no settings key existed yet, and said so in its own
        docblock. That meant a MODERATOR — who holds `logs.view` — could WRITE
        platform settings (auto-archive window, mandatory documents, completion
        threshold) merely because they were allowed to read the audit log. Read
        and write are now separate keys, and neither is granted to MODERATOR.

        Deliberately NOT forked into new near-duplicates: candidate purge reuses
        `candidates.delete` (already SUPER_ADMIN-effective / locked-off
        elsewhere), suspend/reactivate reuse `candidates.edit`, and on-behalf job
        creation reuses `jobs.post_admin`.
      enum:
        - candidates.view
        - candidates.edit
        - candidates.delete
        - candidates.onboard_manual
        - candidates.export
        - employers.view
        - employers.approve_reject
        - employers.suspend
        - employers.delete
        - jobs.view
        - jobs.post_admin
        - jobs.archive
        - applications.manage
        - applications.change_status
        - applications.notes
        - reports.view
        - logs.view
        - billing.manage
        - subscriptions.manage
        - admin_users.manage
        - logs.export
        - roles.view
        - roles.manage
        - settings.view
        - settings.manage
        - candidates.view_documents
        - jobs.moderate

    AuditLogEntry:
      type: object
      required: [id, createdAt, module, action, status, meta]
      description: |
        One audit row (Screen 29). `meta` is ALREADY REDACTED at write time by
        the S2-B2 denylist — no raw PII (passport numbers, phones, emails,
        tokens, OTPs, document keys/URLs) ever reaches this surface, so the
        client may render it verbatim. Audit rows are append-only and are never
        cascade-deleted.
      properties:
        id:
          type: string
          description: >
            The BigInt primary key rendered as a STRING (it exceeds JS's safe
            integer range). This is also the keyset cursor.
          example: '1048576'
        createdAt:
          type: string
          format: date-time
        module:
          type: string
          description: The B2 taxonomy — drives Screen 29's filter chips.
          example: Payments
        action:
          type: string
          description: Dot-namespaced action.
          example: subscription.activated
        actorUserId:
          type: [string, 'null']
          format: uuid
          description: Null for system-driven events (cron sweeps, webhooks).
        actorRole:
          oneOf:
            - $ref: '#/components/schemas/UserRole'
            - type: 'null'
          description: Null for system-driven events.
        targetType:
          type: [string, 'null']
          example: Subscription
        targetId:
          type: [string, 'null']
        status:
          $ref: '#/components/schemas/AuditStatus'
        meta:
          type: object
          additionalProperties: true
          description: Redaction-safe context (counts, ids, codes) — never raw PII.

    AdminDashboard:
      type: object
      required:
        [counts, revenueThisMonthSubunits, currency, pendingEmployerReviews, pendingJobReviews]
      description: |
        Admin overview KPIs. All figures are LIVE aggregates over the existing
        tables (no honest-zeros remain at S6): candidate/employer/job/application
        counts come from the same sources as the employer dashboard, and revenue
        sums PAID orders in the current calendar month.
      properties:
        counts:
          type: object
          required: [candidates, employers, jobs, applications]
          properties:
            candidates:
              type: integer
              description: Non-purged candidate profiles.
            employers:
              type: object
              description: Company counts keyed by CompanyStatus.
              additionalProperties:
                type: integer
              example: { PENDING: 4, APPROVED: 37, REJECTED: 2, SUSPENDED: 1 }
            jobs:
              type: object
              description: Job counts keyed by JobStatus.
              additionalProperties:
                type: integer
              example: { DRAFT: 5, PENDING_REVIEW: 3, ACTIVE: 22, PAUSED: 4, ARCHIVED: 11 }
            applications:
              type: object
              description: Application counts keyed by ApplicationStatus.
              additionalProperties:
                type: integer
              example: { PENDING: 40, SHORTLISTED: 12, SELECTED: 5, REJECTED: 9 }
        revenueThisMonthSubunits:
          type: integer
          minimum: 0
          description: Sum of PAID order totals this calendar month, integer subunits.
        currency:
          type: string
          example: INR
        pendingEmployerReviews:
          type: integer
          description: Companies awaiting approval — the Screen-24 work queue depth.
        pendingJobReviews:
          type: integer
          description: Jobs in PENDING_REVIEW — the Screen-26 work queue depth.

    AnalyticsKpi:
      type: object
      required: [value, previous, deltaPct, spark]
      description: |
        One KPI tile. `deltaPct` is NULL when the previous window was zero —
        growth from nothing has no rate, and the UI renders "New" rather than a
        fabricated percentage. `spark` has exactly one point per day of the
        window (zero-filled), so it is safe to index alongside the series.
      properties:
        value: { type: integer }
        previous: { type: integer }
        deltaPct: { type: number, nullable: true }
        spark:
          type: array
          items: { type: integer }

    AnalyticsSeriesPoint:
      type: object
      required: [date]
      description: |
        One day of a series. `date` is `YYYY-MM-DD` (UTC). Every other key is a
        series name whose value is that day's count. Days with no rows are
        present with explicit zeros — never omitted.
      properties:
        date: { type: string }
      additionalProperties: true

    AnalyticsFunnelStage:
      type: object
      required: [stage, count, pctOfTop, conversionFromPrev]
      description: |
        A COHORT stage — of the applications created in the window, how many EVER
        reached this stage (read from application_timeline, not current status,
        so the funnel cannot go back up). Stages are applied → shortlisted →
        selected; there is no interview or withdrawn stage because
        ApplicationStatus has no such value.
      properties:
        stage: { type: string, enum: [applied, shortlisted, selected] }
        count: { type: integer }
        pctOfTop: { type: number }
        conversionFromPrev: { type: number, nullable: true }

    AnalyticsBucket:
      type: object
      required: [label, count]
      properties:
        label: { type: string }
        count: { type: integer }

    AdminAnalytics:
      type: object
      required:
        [
          range,
          kpis,
          revenue,
          currency,
          candidateGrowth,
          employerGrowth,
          jobActivity,
          applicationTrend,
          funnel,
          applicationStatus,
          topJobs,
          topEmployers,
          topSkills,
          demographics,
          employerStatus,
          jobStatus,
          efficiency,
          needsAttention,
        ]
      description: |
        The admin dashboard's charts, for a trailing window of `days` (default
        30, clamped 1–365). Every figure is a live aggregate over existing rows —
        there is no snapshot table, because `createdAt` plus `application_timeline`
        already ARE the history.

        DELIBERATE OMISSIONS, so the UI does not invent them: no job VIEW counts
        (nothing records a job view), no education distribution (no such field),
        no state-level geography (candidates carry free-text `currentLocation`
        only), and no interview/withdrawn funnel stage.
      properties:
        range:
          type: object
          required: [from, to, days]
          properties:
            from: { type: string, format: date-time }
            to: { type: string, format: date-time, description: EXCLUSIVE upper bound. }
            days: { type: integer }
        kpis:
          type: object
          required: [candidates, employers, jobs, applications, hires]
          properties:
            candidates: { $ref: '#/components/schemas/AnalyticsKpi' }
            employers: { $ref: '#/components/schemas/AnalyticsKpi' }
            jobs: { $ref: '#/components/schemas/AnalyticsKpi' }
            applications: { $ref: '#/components/schemas/AnalyticsKpi' }
            hires: { $ref: '#/components/schemas/AnalyticsKpi' }
        revenue:
          allOf:
            - $ref: '#/components/schemas/AnalyticsKpi'
          description: |
            Revenue INVOICED in the window, in INTEGER SUBUNITS — keyed on the
            invoice's `issuedAt`, because the invoice is the financial record of
            truth. `spark` is deliberately empty: invoices are sparse and lumpy,
            so a mostly-zero daily line would say less than the figure does.
            The client formats it; the server never emits a formatted amount.
        currency:
          type: string
          example: INR
        candidateGrowth:
          type: array
          description: Keys per point — registrations, verified, active.
          items: { $ref: '#/components/schemas/AnalyticsSeriesPoint' }
        employerGrowth:
          type: array
          description: Keys per point — registered, approved.
          items: { $ref: '#/components/schemas/AnalyticsSeriesPoint' }
        jobActivity:
          type: array
          description: Keys per point — created, published, archived.
          items: { $ref: '#/components/schemas/AnalyticsSeriesPoint' }
        applicationTrend:
          type: array
          description: Keys per point — total, pending, shortlisted, selected, rejected.
          items: { $ref: '#/components/schemas/AnalyticsSeriesPoint' }
        funnel:
          type: array
          items: { $ref: '#/components/schemas/AnalyticsFunnelStage' }
        applicationStatus:
          type: array
          items:
            type: object
            required: [status, count]
            properties:
              status: { type: string }
              count: { type: integer }
        topJobs:
          type: array
          items:
            type: object
            required: [title, employerName, status, applications, shortlisted, hires]
            properties:
              title: { type: string }
              employerName: { type: string }
              status: { type: string }
              applications: { type: integer }
              shortlisted: { type: integer }
              hires: { type: integer }
        topEmployers:
          type: array
          items:
            type: object
            required: [name, activeJobs, applications, hires, successRate]
            properties:
              name: { type: string }
              activeJobs: { type: integer }
              applications: { type: integer }
              hires: { type: integer }
              successRate: { type: number }
        topSkills:
          type: array
          description: |
            Skills candidates HOLD (supply), not skills employers ask for —
            job requirements are not a structured field. Labelled as supply in
            the UI so the two are never conflated.
          items:
            type: object
            required: [name, count]
            properties:
              name: { type: string }
              count: { type: integer }
        demographics:
          type: object
          required: [experience, age]
          properties:
            experience:
              type: array
              items: { $ref: '#/components/schemas/AnalyticsBucket' }
            age:
              type: array
              description: Profiles without a dob land in an explicit "Not given" bucket.
              items: { $ref: '#/components/schemas/AnalyticsBucket' }
        employerStatus:
          type: array
          items:
            type: object
            required: [status, count]
            properties:
              status: { type: string }
              count: { type: integer }
        jobStatus:
          type: array
          items:
            type: object
            required: [status, count]
            properties:
              status: { type: string }
              count: { type: integer }
        efficiency:
          type: object
          required: [daysToShortlist, daysToHire, hireRate, applicationsPerJob]
          description: |
            MEDIAN days, not mean — one application left open for months would
            drag an average away from the typical candidate's experience. NULL
            when the window contains no such transition.
          properties:
            daysToShortlist: { type: number, nullable: true }
            daysToHire: { type: number, nullable: true }
            hireRate: { type: number }
            applicationsPerJob: { type: number }
        needsAttention:
          type: object
          required:
            [
              pendingEmployerReviews,
              pendingJobReviews,
              pendingApplications,
              incompleteProfiles,
              completionThreshold,
            ]
          properties:
            pendingEmployerReviews: { type: integer }
            pendingJobReviews: { type: integer }
            pendingApplications: { type: integer }
            incompleteProfiles: { type: integer }
            completionThreshold:
              type: integer
              description: The candidates.min_completion_pct setting the count was taken against.

    RbacCell:
      type: object
      required: [role, permission, enabled, locked]
      description: |
        One cell of the Screen-27 matrix. `locked = true` means IMMUTABLE — the
        entire SUPER_ADMIN column plus the seeded locked set (e.g.
        `billing.manage` for non-super roles). A PATCH targeting a locked cell is
        rejected 423 `PERMISSION_CELL_LOCKED` and writes nothing.
      properties:
        role:
          $ref: '#/components/schemas/UserRole'
        permission:
          $ref: '#/components/schemas/PermissionKey'
        enabled:
          type: boolean
        locked:
          type: boolean

    RbacMatrix:
      type: object
      required: [roles, permissions, cells]
      description: |
        The full permission matrix. `roles` carries ONLY the admin-side roles —
        CANDIDATE and EMPLOYER have no rows (they are not admin-console roles and
        are never rendered as columns).
      properties:
        roles:
          type: array
          items:
            $ref: '#/components/schemas/UserRole'
          example: [SUPER_ADMIN, ADMIN, MODERATOR, SUPPORT]
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/PermissionKey'
        cells:
          type: array
          items:
            $ref: '#/components/schemas/RbacCell'

    AdminMe:
      type: object
      required: [role, permissions]
      description: |
        The caller's own identity and EFFECTIVE permission set — the source the
        admin console's navigation and in-screen affordances render from.

        `permissions` is the flat list of keys the caller currently HOLDS (enabled
        cells only). Locked-ness is irrelevant here: a locked-OFF cell is simply
        absent, because the caller does not hold it. Screen 27 is where lock state
        matters; this endpoint answers only "what can I do right now?".

        Consumers MUST treat this as UX input, never as an authorization decision.
      properties:
        role:
          $ref: '#/components/schemas/UserRole'
        permissions:
          type: array
          description: Keys the caller holds. May be empty (a role granted nothing).
          items:
            $ref: '#/components/schemas/PermissionKey'
          example: [candidates.view, employers.view, jobs.view, logs.view, reports.view]

    AdminCandidateCard:
      type: object
      required: [id, userId, fullName, status, profileVisible, completionPct, createdAt]
      description: |
        Admin-context candidate row (Screen 25) — FULLER than the employer view
        (contact details and deletion state are included, since admins are the
        DPDP data controllers) but STILL carries NO document keys or URLs.
        Document CONTENT is a separate, per-issuance-audited grant
        (`GET /admin/candidates/{id}/documents/{type}/url`).

        A PURGED candidate is a tombstone: `fullName` is "Deleted user",
        contact fields are null, `documents` is empty, and `purgedAt` is set.
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        fullName:
          type: string
        phone:
          type: [string, 'null']
          description: Admin context — the candidate's showPhone toggle does NOT hide it.
        email:
          type: [string, 'null']
        status:
          $ref: '#/components/schemas/UserStatus'
        profileVisible:
          type: boolean
          description: The candidate's own browse-pool visibility toggle.
        completionPct:
          type: integer
        documents:
          type: array
          description: Upload STATUS only — never a key or URL.
          items:
            $ref: '#/components/schemas/CandidateDocumentStatus'
        deletionDueAt:
          type: [string, 'null']
          format: date-time
          description: Set when the candidate requested their own 30-day self-deletion.
        purgedAt:
          type: [string, 'null']
          format: date-time
          description: Set once anonymized (admin purge OR the elapsed self-deletion).
        createdAt:
          type: string
          format: date-time

    AdminCandidateDetail:
      allOf:
        - $ref: '#/components/schemas/AdminCandidateCard'
        - type: object
          required: [experiences, skills, applicationCount]
          description: |
            ADDED IN S6b-B1. The single-candidate admin view (Screen 25's review
            panel): the card plus experiences, skills and the application count.
            Same privacy rule as the card — document STATUS only, never keys or
            URLs. For a PURGED candidate, `experiences` and `skills` are empty
            (the purge deletes those rows) and the card fields are the tombstone.
          properties:
            experiences:
              type: array
              items:
                $ref: '#/components/schemas/WorkExperience'
            skills:
              type: array
              items:
                $ref: '#/components/schemas/CandidateSkill'
            applicationCount:
              type: integer
              description: >
                Total applications ever submitted — survives the purge (the
                applications are tombstoned, not deleted).

    AdminJobRow:
      type: object
      required: [id, humanId, title, companyId, companyName, status, isFeatured, isUrgent, createdAt]
      description: |
        Admin-context job row (Screen 26) — every status is visible, including
        DRAFT and PENDING_REVIEW which no employer-facing or public list returns.
        S6b-B2 added `market`, `views` and `moderationReason` (the reject reason,
        also employer-visible on their own job row).
      properties:
        market:
          $ref: '#/components/schemas/JobMarket'
        views:
          type: integer
          description: Lifetime job-detail view count.
        moderationReason:
          type: [string, 'null']
          description: >
            Set when an admin REJECTed the job in review; cleared on approve.
            Employer-visible by design — it tells them what to fix.
        id:
          type: string
          format: uuid
        humanId:
          type: string
          example: JB-2026-00042
        title:
          type: string
        companyId:
          type: string
          format: uuid
        companyName:
          type: string
        status:
          $ref: '#/components/schemas/JobStatus'
        isFeatured:
          type: boolean
          description: ADMIN-SET (decision 3) — drives the S2-F1 badge + S2-B6 filter.
        isUrgent:
          type: boolean
          description: ADMIN-SET (decision 3) — drives the S2-F1 badge + S2-B6 filter.
        applicantCount:
          type: integer
        publishedAt:
          type: [string, 'null']
          format: date-time
        createdAt:
          type: string
          format: date-time

    NoteEntry:
      type: object
      required: [id, authorUserId, authorRole, body, createdAt]
      description: |
        An INTERNAL admin note on an application (Screen 26).

        **Internal-only — never surfaced to the candidate or the employer.**
        Notes are not part of `Application`, `ApplicationDetail`,
        `ApplicationCard`, `ApplicantCard`, or the candidate-facing
        `ApplicationTimelineEntry` — the timeline mapper already excludes them
        and must continue to. Adding a note to any non-admin surface is a
        contract violation.
      properties:
        id:
          type: string
          format: uuid
        authorUserId:
          type: string
          format: uuid
        authorRole:
          $ref: '#/components/schemas/UserRole'
        body:
          type: string
          maxLength: 2000
        createdAt:
          type: string
          format: date-time

    AdminJobDetail:
      allOf:
        - $ref: '#/components/schemas/Job'
        - type: object
          required: [humanId, isFeatured, isUrgent, companyStatus]
          description: |
            0.8.1 — the moderation detail (GET /admin/jobs/{id}): the full
            internal `Job` (so Screen 26 can render the job as candidates
            would see it, whatever its status) plus the admin row facts and
            `companyStatus` — the panel flags a suspended employer BEFORE the
            approve attempt rather than letting the 403 announce it.
          properties:
            humanId:
              type: string
              example: JB-2026-00042
            isFeatured:
              type: boolean
            isUrgent:
              type: boolean
            views:
              type: integer
              description: Lifetime job-detail view count.
            moderationReason:
              type: [string, 'null']
              description: The reject reason, when the job was returned to DRAFT.
            companyStatus:
              $ref: '#/components/schemas/CompanyStatus'
            # The structured work-condition / optional-benefit columns the S2-B4
            # implementation actually stores (the base Job schema's freeform
            # `workConditions` predates them and is never emitted by the API).
            hoursPerDay:
              type: integer
            daysPerWeek:
              type: integer
            overtime:
              type: boolean
            foodAllowance:
              type: boolean
            airTicketArrival:
              type: boolean
            airTicketDeparture:
              type: boolean
            otherAllowance:
              type: [string, 'null']
            contractPeriodMonths:
              type: [integer, 'null']
              deprecated: true
              description: >
                DEPRECATED — never collected by any form and null on every row.
                Use `contractDuration`, which stores the band the employer
                actually chose.

    ContractDuration:
      type: string
      enum: [MONTHS_1_6, MONTHS_6_12, YEARS_1_2, YEARS_2_5]
      description: >
        How long a CONTRACT role runs, as a BAND. Bands rather than a month
        count because that is what an employer knows at posting time — storing
        an exact figure would invent precision nobody stated. Required exactly
        when `employmentType` is CONTRACT (400 `CONTRACT_DURATION_REQUIRED`),
        and rejected for any other employment type (400
        `CONTRACT_DURATION_NOT_APPLICABLE`).

    AdminApplicationRow:
      allOf:
        - $ref: '#/components/schemas/Application'
        - type: object
          description: |
            0.8.1 — the admin list row (GET /admin/applications): the
            admin-context application plus the display denormalizations the
            S4-B3 implementation already returned (`candidateName`,
            `jobTitle`). `candidateName` is null for a purged candidate's
            tombstoned application.
          properties:
            candidateName:
              type: [string, 'null']
            jobTitle:
              type: [string, 'null']

    AdminTimelineEntry:
      type: object
      required: [fromStatus, toStatus, actorRole, isAdminOverride, createdAt]
      description: |
        0.8.1 — one transition in the ADMIN serialization of an application's
        history. Unlike the candidate-facing `ApplicationTimelineEntry`, this
        carries `overrideReason` — the reason an admin recorded for a
        corrective move is FOR admins and the audit trail, and this is its
        only serialization. Never emitted to candidate or employer contexts.
      properties:
        fromStatus:
          oneOf:
            - $ref: '#/components/schemas/ApplicationStatus'
            - type: 'null'
          description: Null on the initial (apply) entry.
        toStatus:
          $ref: '#/components/schemas/ApplicationStatus'
        actorRole:
          oneOf:
            - $ref: '#/components/schemas/UserRole'
            - type: 'null'
          description: Null when the transition was system-initiated.
        isAdminOverride:
          type: boolean
        overrideReason:
          type: [string, 'null']
          description: Present on admin corrective moves. ADMIN CONTEXT ONLY.
        createdAt:
          type: string
          format: date-time

    AdminApplicationDetail:
      allOf:
        - $ref: '#/components/schemas/AdminApplicationRow'
        - type: object
          required: [timeline]
          description: |
            0.8.1 — the Screen 26 application detail
            (GET /admin/applications/{id}): the admin row plus the FULL
            timeline (see `AdminTimelineEntry`).
          properties:
            timeline:
              type: array
              items:
                $ref: '#/components/schemas/AdminTimelineEntry'

# ─── Paths ───────────────────────────────────────────────────────────────────

paths:
  # ── Health (unversioned — path is /health at root, NOT under /api/v1) ──────
  /health:
    servers:
      - url: /
        description: Root — health is unversioned
    get:
      operationId: getHealth
      tags: [health]
      summary: Liveness probe
      description: >
        Returns 200 when the API process is up. Used by load balancers and
        container orchestrators. No authentication required.
      security: []
      responses:
        '200':
          description: API process is healthy
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: ok

  # ── Auth: signup ─────────────────────────────────────────────────────────────
  /auth/signup:
    post:
      operationId: postAuthSignup
      tags: [auth]
      summary: Register a new user account
      description: >
        Creates a new CANDIDATE or EMPLOYER account with email + password.
        Returns an access token and sets the `sic_refresh` HttpOnly cookie.
        Rate-limited: 5 requests / 60 s per IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, role, acceptedTerms]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                  description: Must meet the strength policy (length, mixed case, digit/symbol)
                role:
                  type: string
                  enum: [CANDIDATE, EMPLOYER]
                acceptedTerms:
                  type: boolean
                  description: Must be true; request rejected if false
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/AuthTokenResponse'
        '409':
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                type: about:blank
                title: Email already registered
                status: 409
                detail: An account with this email already exists.
                code: EMAIL_TAKEN
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                type: about:blank
                title: Validation failed
                status: 422
                detail: One or more fields are invalid.
                code: VALIDATION_ERROR
                meta:
                  errors:
                    - field: email
                      code: INVALID_EMAIL

  # ── Auth: login ──────────────────────────────────────────────────────────────
  /auth/login:
    post:
      operationId: postAuthLogin
      tags: [auth]
      summary: Email + password login
      description: >
        Authenticates with email and password. Returns an access token and sets
        the `sic_refresh` HttpOnly cookie. Rate-limited: 5 requests / 60 s per IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/AuthTokenResponse'
        '401':
          description: Bad credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                type: about:blank
                title: Invalid credentials
                status: 401
                detail: Email or password is incorrect.
                code: INVALID_CREDENTIALS
        '403':
          description: Account suspended
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                type: about:blank
                title: Account suspended
                status: 403
                detail: Your account has been suspended.
                code: ACCOUNT_SUSPENDED

  # ── Auth: Google OAuth ────────────────────────────────────────────────────────
  /auth/google:
    get:
      operationId: getAuthGoogle
      tags: [auth]
      summary: Initiate Google OAuth flow
      description: >
        Redirects the browser to Google's OAuth consent screen. Candidates only
        — employers and admins MUST use email/password.
        The callback URL is `GET /auth/google/callback`.
      security: []
      responses:
        '302':
          description: Redirect to Google OAuth

  /auth/google/callback:
    get:
      operationId: getAuthGoogleCallback
      tags: [auth]
      summary: Google OAuth callback
      description: |
        Handles the Google OAuth callback. On success:
        1. Sets the `sic_refresh` HttpOnly cookie.
        2. Redirects to `{WEB_APP_URL}/auth/callback` (no token in the URL).

        **Error codes:**
        - `GOOGLE_NOT_ALLOWED` (403) — the email is registered as employer/admin;
          redirected to the error page with `?error=GOOGLE_NOT_ALLOWED`.
      security: []
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
      responses:
        '302':
          description: Redirect to web app callback URL
        '403':
          description: Google sign-in not allowed for this email/role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                type: about:blank
                title: Google sign-in not allowed
                status: 403
                detail: This email is registered as an employer or admin — use email/password.
                code: GOOGLE_NOT_ALLOWED

  # ── Auth: refresh ────────────────────────────────────────────────────────────
  /auth/refresh:
    post:
      operationId: postAuthRefresh
      tags: [auth]
      summary: Rotate the refresh token and issue a new access token
      description: >
        Reads the `sic_refresh` HttpOnly cookie. Issues a new access token and
        rotates the refresh token (old token is revoked). On TOKEN_REUSE, all
        sessions for the user are wiped (token-family rotation strategy).
      security: []
      responses:
        '200':
          description: New access token issued
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [accessToken]
                    properties:
                      accessToken:
                        type: string
        '401':
          description: Refresh token missing, invalid, or reused
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid:
                  value:
                    type: about:blank
                    title: Invalid refresh token
                    status: 401
                    detail: Refresh token is missing or expired.
                    code: INVALID_REFRESH
                reuse:
                  value:
                    type: about:blank
                    title: Token reuse detected
                    status: 401
                    detail: All sessions have been revoked due to suspected token theft.
                    code: TOKEN_REUSE

  # ── Auth: logout ─────────────────────────────────────────────────────────────
  /auth/logout:
    post:
      operationId: postAuthLogout
      tags: [auth]
      summary: Revoke the current session
      description: >
        Blacklists the current access token JTI (until expiry) and revokes the
        `sic_refresh` cookie. Clears the cookie from the response.
        Idempotent — always returns 204.
      responses:
        '204':
          description: Session revoked

  # ── Auth: OTP send (phone verification) ──────────────────────────────────────
  /auth/otp/send:
    post:
      operationId: postAuthOtpSend
      tags: [auth]
      summary: Send a phone-verification OTP
      description: |
        Sends a one-time password to the given phone number via WhatsApp for the
        purpose of **phone verification** during candidate onboarding.

        **Rate limits:** 5 sends / hour / phone number.

        **409 PHONE_NOT_ON_WHATSAPP** — returned when the number is valid but
        not reachable via the WhatsApp channel.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone:
                  type: string
                  description: E.164 phone number
                  example: '+919876543210'
      responses:
        '200':
          description: OTP sent
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [sent]
                    properties:
                      sent:
                        type: boolean
                        example: true
        '409':
          description: Phone number is not reachable via WhatsApp
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                type: about:blank
                title: Phone not on WhatsApp
                status: 409
                detail: This number is not reachable via WhatsApp. Please try a different number.
                code: PHONE_NOT_ON_WHATSAPP
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                type: about:blank
                title: Too many requests
                status: 429
                detail: OTP send limit reached. Try again in an hour.
                code: RATE_LIMIT_EXCEEDED

  # ── Auth: OTP verify (phone verification) ────────────────────────────────────
  /auth/otp/verify:
    post:
      operationId: postAuthOtpVerify
      tags: [auth]
      summary: Verify the phone-verification OTP
      description: |
        Verifies a `purpose = PHONE_VERIFY` OTP for the caller's candidate profile.
        On success, sets `phoneVerifiedAt` and `whatsappCapable` on the candidate row.

        **401 INVALID_OTP** covers: wrong OTP, expired OTP, and maximum-attempts exceeded.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, otp]
              properties:
                phone:
                  type: string
                  example: '+919876543210'
                otp:
                  type: string
                  example: '123456'
      responses:
        '200':
          description: Phone verified
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [phoneVerified, whatsappCapable]
                    properties:
                      phoneVerified:
                        type: boolean
                        example: true
                      whatsappCapable:
                        type: boolean
                        example: true
        '401':
          description: Invalid, expired, or over-attempted OTP
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                type: about:blank
                title: Invalid OTP
                status: 401
                detail: OTP is incorrect, expired, or too many attempts.
                code: INVALID_OTP

  # ── Auth: OTP login — start (enumeration-safe) ───────────────────────────────
  /auth/login/phone/start:
    post:
      operationId: postAuthLoginPhoneStart
      tags: [auth]
      summary: Start OTP-based phone login
      description: |
        Initiates OTP-based login for an existing candidate account.

        **ENUMERATION-SAFE: always returns 200 regardless of whether a verified
        candidate exists for the phone number.**

        Internal behavior: if a CANDIDATE with a VERIFIED phone matching `phone`
        exists → sends a `purpose = LOGIN` OTP via WhatsApp. Otherwise → silent no-op.

        **OTP login is for existing candidates only. It never creates accounts.**
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone:
                  type: string
                  example: '+919876543210'
      responses:
        '200':
          description: Always returned (enumeration-safe)
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [message]
                    properties:
                      message:
                        type: string
                        example: If an account exists, an OTP has been sent.
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ── Auth: OTP login — verify ──────────────────────────────────────────────────
  /auth/login/phone/verify:
    post:
      operationId: postAuthLoginPhoneVerify
      tags: [auth]
      summary: Verify OTP and issue tokens for phone login
      description: |
        Verifies a `purpose = LOGIN` OTP and, on success, issues an access token
        and sets the `sic_refresh` HttpOnly cookie.

        **Candidates only.** Non-candidate callers always receive 401 INVALID_OTP
        (to preserve enumeration safety).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, otp]
              properties:
                phone:
                  type: string
                  example: '+919876543210'
                otp:
                  type: string
                  example: '123456'
      responses:
        '200':
          description: OTP verified — tokens issued
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/AuthTokenResponse'
        '401':
          description: Invalid, expired, or over-attempted OTP
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                type: about:blank
                title: Invalid OTP
                status: 401
                detail: OTP is incorrect, expired, or too many attempts.
                code: INVALID_OTP

  # ── Auth: password reset ──────────────────────────────────────────────────────
  /auth/forgot-password:
    post:
      operationId: postAuthForgotPassword
      tags: [auth]
      summary: Request a password-reset link
      description: |
        Sends a password-reset link to the email via AWS SES — **if the email
        exists**. Always returns 200 regardless (enumeration-safe).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Always returned (enumeration-safe)
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [message]
                    properties:
                      message:
                        type: string
                        example: If this email is registered, a reset link has been sent.

  /auth/reset-password:
    post:
      operationId: postAuthResetPassword
      tags: [auth]
      summary: Set a new password using a reset token
      description: >
        Accepts the signed token from the reset email and sets a new password.
        Token is single-use and short-lived.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token:
                  type: string
                password:
                  type: string
                  minLength: 8
      responses:
        '200':
          description: Password reset successful
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [reset]
                    properties:
                      reset:
                        type: boolean
                        example: true
        '400':
          description: Token invalid or expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                type: about:blank
                title: Invalid reset token
                status: 400
                detail: The reset token is invalid or has expired.
                code: INVALID_RESET_TOKEN
        '422':
          description: Validation error (e.g. weak password)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ── Candidate: profile ────────────────────────────────────────────────────────
  /candidates/me:
    get:
      operationId: getCandidateMe
      tags: [candidate]
      summary: Get the authenticated candidate's profile (self-view)
      description: >
        Returns the full profile including phone and religion regardless of privacy
        toggles, since this is the candidate's own data.
      responses:
        '200':
          description: Candidate profile
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/CandidateProfile'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    patch:
      operationId: patchCandidateMe
      tags: [candidate]
      summary: Update personal info fields
      description: >
        Partial update of editable personal-info fields. Returns the updated
        full profile.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fullName:
                  type: string
                fatherName:
                  type: string
                dob:
                  type: string
                  format: date
                maritalStatus:
                  $ref: '#/components/schemas/MaritalStatus'
                religion:
                  type: string
                languages:
                  type: array
                  items:
                    type: string
                jobCategoryId:
                  type: string
                  format: uuid
                currentLocation:
                  type: string
                nationality:
                  type: string
                noticePeriod:
                  type: integer
                summary:
                  type: string
                  maxLength: 500
                  description: >-
                    Candidate-written intro rendered at the TOP of the resume.
                    Send an empty string to clear it.
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/CandidateProfile'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ── Candidate: completion ─────────────────────────────────────────────────────
  /candidates/me/completion:
    get:
      operationId: getCandidateMeCompletion
      tags: [candidate]
      summary: Get profile completion breakdown
      description: >
        Returns server-computed completion percentage, per-section breakdown, and
        whether the candidate passes the apply gate. The gate is enforced at apply
        time (Sprint 4), not here.
      responses:
        '200':
          description: Completion result
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/CompletionResult'

  # ── Candidate: settings ───────────────────────────────────────────────────────
  /candidates/me/settings:
    patch:
      operationId: patchCandidateMeSettings
      tags: [candidate]
      summary: Update candidate privacy and notification settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                showPhone:
                  type: boolean
                showReligion:
                  type: boolean
                waNotifications:
                  type: boolean
                emailNotifs:
                  type: boolean
                profileVisible:
                  type: boolean
                isAvailable:
                  type: boolean
                salaryExpectationMin:
                  type: integer
                salaryExpectationMax:
                  type: integer
                salaryExpectationCurrency:
                  type: string
      responses:
        '200':
          description: Settings updated
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/CandidateProfile'

  # ── Candidate: experiences ────────────────────────────────────────────────────
  /candidates/me/experiences:
    post:
      operationId: postCandidateMeExperiences
      tags: [candidate]
      summary: Add a work experience entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type:
                  $ref: '#/components/schemas/ExperienceType'
                country:
                  type: string
                companyName:
                  type: string
                role:
                  type: string
                years:
                  type: integer
                  minimum: 0
                months:
                  type: integer
                  minimum: 0
                  maximum: 11
                startDate:
                  type: string
                  format: date
                endDate:
                  type: string
                  format: date
      responses:
        '201':
          description: Experience created
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/WorkExperience'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /candidates/me/experiences/{id}:
    patch:
      operationId: patchCandidateMeExperienceById
      tags: [candidate]
      summary: Update a work experience entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  $ref: '#/components/schemas/ExperienceType'
                country:
                  type: string
                companyName:
                  type: string
                role:
                  type: string
                years:
                  type: integer
                months:
                  type: integer
                startDate:
                  type: string
                  format: date
                endDate:
                  type: string
                  format: date
      responses:
        '200':
          description: Updated experience
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/WorkExperience'
        '404':
          description: Experience not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      operationId: deleteCandidateMeExperienceById
      tags: [candidate]
      summary: Delete a work experience entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Deleted
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ── Candidate: skills ─────────────────────────────────────────────────────────
  /candidates/me/skills:
    post:
      operationId: postCandidateMeSkills
      tags: [candidate]
      summary: Add a skill
      description: >
        Only the first 3 skills contribute to the match score. Additional skills
        beyond 3 are stored but do not increase the score.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
      responses:
        '201':
          description: Skill added
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/CandidateSkill'

  /candidates/me/skills/{id}:
    delete:
      operationId: deleteCandidateMeSkillById
      tags: [candidate]
      summary: Remove a skill
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Deleted
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ── Candidate: documents ──────────────────────────────────────────────────────
  /candidates/me/documents/presign:
    post:
      operationId: postCandidateMeDocumentsPresign
      tags: [candidate]
      summary: Get a presigned R2 upload URL
      description: |
        Issues a short-lived presigned PUT URL for direct R2 upload.

        **Accepted types and size limits:**
        - `PASSPORT`: 2 MB max; image/jpeg, image/png, application/pdf
        - `EXPERIENCE_CERT`: 2 MB max; application/pdf, image/jpeg, image/png
        - `EDUCATIONAL_CERT`: 2 MB max; application/pdf, image/jpeg, image/png

        `WORKING_VIDEO` is Phase 2 only — not accepted at MVP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, fileName, mimeType, sizeBytes]
              properties:
                type:
                  $ref: '#/components/schemas/DocumentType'
                fileName:
                  type: string
                  example: passport.pdf
                mimeType:
                  type: string
                  example: application/pdf
                sizeBytes:
                  type: integer
      responses:
        '200':
          description: Presigned URL ready
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [uploadUrl, key, expiresInSeconds]
                    properties:
                      uploadUrl:
                        type: string
                        format: uri
                      key:
                        type: string
                      expiresInSeconds:
                        type: integer
                        example: 300
        '422':
          description: Invalid file type or size
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /candidates/me/documents/confirm:
    post:
      operationId: postCandidateMeDocumentsConfirm
      tags: [candidate]
      summary: Confirm an uploaded document
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key]
              properties:
                key:
                  type: string
                expiryDate:
                  type: string
                  format: date
                  description: Required for PASSPORT type
      responses:
        '200':
          description: Document recorded
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/CandidateDocument'
        '422':
          description: Upload not found (HEAD check failed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                type: about:blank
                title: Upload not found
                status: 422
                detail: The uploaded file was not found in storage. Please try uploading again.
                code: UPLOAD_NOT_FOUND

  # ── Candidate: profile photo (avatar) ─────────────────────────────────────────
  /candidates/me/photo/presign:
    post:
      operationId: postCandidateMePhotoPresign
      tags: [candidate]
      summary: Get a presigned R2 upload URL for the profile photo
      description: |
        Issues a short-lived presigned PUT URL for the candidate's avatar image.
        Accepted: image/jpeg, image/png, image/webp — 2 MB max. The declared
        mime/size are a first-line check; the authoritative gate is the HEAD
        re-validation in confirm.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fileName, mimeType, sizeBytes]
              properties:
                fileName:
                  type: string
                  example: avatar.jpg
                mimeType:
                  type: string
                  example: image/jpeg
                sizeBytes:
                  type: integer
      responses:
        '200':
          description: Presigned URL ready
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [uploadUrl, key, expiresInSeconds]
                    properties:
                      uploadUrl:
                        type: string
                        format: uri
                      key:
                        type: string
                      expiresInSeconds:
                        type: integer
                        example: 300
        '422':
          description: Invalid file type or size
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /candidates/me/photo/confirm:
    post:
      operationId: postCandidateMePhotoConfirm
      tags: [candidate]
      summary: Confirm an uploaded profile photo
      description: |
        Persists the uploaded avatar after OWNERSHIP (key prefix) + HEAD
        verification (real mime/size), best-effort deletes the previous photo,
        and returns the updated profile carrying a freshly-signed `photoUrl`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key]
              properties:
                key:
                  type: string
      responses:
        '200':
          description: Photo recorded; the updated profile is returned
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/CandidateProfile'
        '403':
          description: The key is not owned by this candidate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Upload not found (HEAD check failed) or invalid file
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ── Candidate: working video introduction ─────────────────────────────────────
  # Same presign -> PUT to R2 -> confirm shape as photos and documents.
  #
  # The SIZE ceiling is enforced server-side from the stored object (HEAD), so it
  # cannot be talked around. The DURATION is measured by the browser and declared
  # by the client: verifying it server-side would need a demuxer this process does
  # not carry. The byte cap is the limit that actually protects the platform; the
  # length cap is a product rule. Stated here so no reader assumes otherwise.
  /candidates/me/video:
    get:
      operationId: getCandidateMeVideo
      tags: [candidate]
      summary: Current working-video status and the active limits
      description: |
        Returns whether a video exists plus the limits currently in force, so the
        UI states the real numbers instead of hardcoding its own copy. The limits
        come from Settings (`candidates.video_max_mb`,
        `candidates.video_max_minutes`) and a Super-Admin may change them.
      responses:
        '200':
          description: Video status
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/CandidateVideoStatus'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      operationId: deleteCandidateMeVideo
      tags: [candidate]
      summary: Remove the working video
      description: |
        Clears the video columns and queues the R2 object for deletion.
        IDEMPOTENT — removing a video that does not exist succeeds.
      responses:
        '200':
          description: Video removed (or there was none)
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/CandidateVideoStatus'
  /candidates/me/video/presign:
    post:
      operationId: postCandidateMeVideoPresign
      tags: [candidate]
      summary: Presign a working-video upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fileName, mimeType, sizeBytes, durationSec]
              properties:
                fileName:
                  type: string
                mimeType:
                  type: string
                  enum: [video/mp4, video/quicktime, video/webm]
                  description: The container formats a phone or browser actually produces.
                sizeBytes:
                  type: integer
                  minimum: 1
                durationSec:
                  type: number
                  minimum: 1
                  description: >
                    Length as the browser measured it
                    (`HTMLVideoElement.duration`). Fractional values are normal
                    and are rounded once, on write.
      responses:
        '200':
          description: Presigned PUT url
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [uploadUrl, key, expiresInSeconds]
                    properties:
                      uploadUrl:
                        type: string
                        format: uri
                      key:
                        type: string
                      expiresInSeconds:
                        type: integer
                        example: 300
        '422':
          description: >
            `INVALID_FILE_TYPE`, `FILE_TOO_LARGE` (meta.maxMb) or
            `VIDEO_TOO_LONG` (meta.maxDurationSec).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /candidates/me/video/confirm:
    post:
      operationId: postCandidateMeVideoConfirm
      tags: [candidate]
      summary: Confirm an uploaded working video
      description: |
        Verifies OWNERSHIP (key prefix) and that the PUT landed (HEAD), re-checks
        the REAL size and mime from the object, writes the video columns and
        queues the replaced object for deletion.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key, durationSec]
              properties:
                key:
                  type: string
                durationSec:
                  type: number
                  minimum: 1
      responses:
        '200':
          description: Video recorded
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/CandidateVideoStatus'
        '403':
          description: The key is not owned by this candidate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: >
            `UPLOAD_NOT_FOUND`, `INVALID_FILE_TYPE`, `FILE_TOO_LARGE` or
            `VIDEO_TOO_LONG`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /candidates/me/video/url:
    get:
      operationId: getCandidateMeVideoUrl
      tags: [candidate]
      summary: Short-expiry signed playback url for the candidate's own video
      responses:
        '200':
          description: Signed url
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [url, expiresInSeconds]
                    properties:
                      url:
                        type: string
                      expiresInSeconds:
                        type: integer
        '404':
          description: No video uploaded (`VIDEO_NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ── Candidate: complete onboarding ────────────────────────────────────────────
  /candidates/me/complete-onboarding:
    post:
      operationId: postCandidateMeCompleteOnboarding
      tags: [candidate]
      summary: Mark onboarding as complete
      description: |
        **SOFT-BLOCK:** Succeeds even if mandatory documents are missing or
        completion is below the apply threshold. The apply gate is enforced at
        job-apply time (Sprint 4), not here.
      responses:
        '200':
          description: Onboarding marked complete
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [completionPct]
                    properties:
                      completionPct:
                        type: integer
                        minimum: 0
                        maximum: 100

  # ── Candidate: notifications (S2) ────────────────────────────────────────────
  /candidates/me/notifications:
    get:
      operationId: getCandidateMeNotifications
      tags: [notifications]
      summary: Get the candidate's in-app notifications (cursor-paginated)
      description: |
        Returns cursor-paginated notifications for the authenticated candidate.

        **Filter categories:**
        - `applications` — APPLICATION_UPDATE type
        - `jobs` — JOB_MATCH type
        - `profile` — PROFILE_REMINDER and DOCUMENT_STATUS types
        - `system` — SYSTEM type
        - (omit `filter`) — all types

        `unread=true` restricts to unread notifications only.
      parameters:
        - name: filter
          in: query
          description: Notification category filter
          schema:
            type: string
            enum: [applications, jobs, profile, system]
        - name: unread
          in: query
          description: If true, return only unread notifications
          schema:
            type: boolean
        - $ref: '#/components/parameters/CursorParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Cursor-paginated notifications
          content:
            application/json:
              schema:
                type: object
                required: [data, nextCursor]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Notification'
                  nextCursor:
                    type: [string, 'null']
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /candidates/me/notifications/read:
    post:
      operationId: postCandidateMeNotificationsRead
      tags: [notifications]
      summary: Mark notifications as read
      description: >
        Marks specific notifications (by `ids`) or all notifications (`all: true`)
        as read. If both are provided, `all` takes precedence.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  type: array
                  items:
                    type: string
                    format: uuid
                  description: Specific notification IDs to mark read
                all:
                  type: boolean
                  description: If true, mark every notification as read
      responses:
        '200':
          description: Notifications marked as read
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [markedCount]
                    properties:
                      markedCount:
                        type: integer
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ── Candidate: profile views (S3) ────────────────────────────────────────────
  /candidates/me/profile-views:
    get:
      operationId: getCandidateMeProfileViews
      tags: [candidate]
      summary: Get profile view analytics for the authenticated candidate (S3)
      description: |
        Returns total views, views in the last 30 days, and up to 20 most recent
        individual view events (company name + timestamp).

        Profile views are recorded when an employer calls
        `GET /employers/candidates/:id` — deduplicated per (company, candidate)
        per rolling 24-hour window.
      responses:
        '200':
          description: Profile view analytics
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/ProfileViewsSummary'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ── Account: self-deletion ────────────────────────────────────────────────────
  /account:
    delete:
      operationId: deleteAccount
      tags: [candidate]
      summary: Request account deletion
      description: |
        Sets the account status to `PENDING_DELETION` and schedules a 30-day
        purge job. Returns the deletion due date.

        Financial records and `audit_logs` are never cascade-deleted per the
        platform invariants.
      responses:
        '202':
          description: Deletion scheduled
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [deletionDueAt]
                    properties:
                      deletionDueAt:
                        type: string
                        format: date-time

  # ── Resume (CR-001 — frozen in S7-0) ─────────────────────────────────────────
  # Settings CRUD, ASYNC generation (trigger + poll), and delivery. All routes
  # bearerAuth, CANDIDATE role. Out of scope, locked at this freeze: the public
  # slug page (no public endpoint; the dormant column stays dormant), video
  # portfolio endpoints, hi/ar rendering (ResumeSettings.language is en-only).
  /candidates/me/resume:
    get:
      operationId: getCandidateMeResume
      tags: [resume]
      summary: Resume settings + the CURRENT generation summary
      description: |
        The "current" read Screen 12/Step 4 renders from: the candidate's
        settings (defaults applied when they never set them — religion and
        passport-number OFF, phone and father's-name ON) and, when a resume has
        ever been generated, the latest generation's summary ("last generated
        {date}"). This IS the optional `/resume/current` endpoint from the
        CR-001 sketch — folded into the existing read rather than added beside
        it.
      responses:
        '200':
          description: Resume info
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [settings]
                    properties:
                      settings:
                        $ref: '#/components/schemas/ResumeSettings'
                      lastRenderedAt:
                        type: [string, 'null']
                        format: date-time
                      current:
                        oneOf:
                          - $ref: '#/components/schemas/ResumeGeneration'
                          - type: 'null'
                        description: The latest generation, when one exists.

  /candidates/me/resume/settings:
    patch:
      operationId: patchCandidateMeResumeSettings
      tags: [resume]
      summary: Update resume rendering settings (PARTIAL)
      description: |
        Body is a PARTIAL `ResumeSettings` — omitted toggles keep their value.

        **Settings apply at GENERATION time.** A change made after a PDF was
        generated does NOT alter the stored PDF (the S7-B1 byte-extraction
        tests depend on that snapshot semantics) — the candidate REGENERATES
        for the change to take effect. `language` accepts only `en` at MVP
        (enum-enforced).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              description: Partial ResumeSettings — any subset of its fields.
              properties:
                language:
                  type: string
                  enum: [en]
                showPhone:
                  type: boolean
                showReligion:
                  type: boolean
                showFatherName:
                  type: boolean
                showPassportNumber:
                  type: boolean
                template:
                  type: string
                  # Only the templates that EXIST are accepted — see the
                  # ResumeSettings.template description. This body carries
                  # additionalProperties: false, so the property must be listed
                  # explicitly to be accepted at all.
                  enum: [CLASSIC, MODERN, COMPACT, MINIMAL, ELEGANT, EXECUTIVE, TIMELINE]
      responses:
        '200':
          description: Settings updated (the FULL resulting settings)
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/ResumeSettings'

  /candidates/me/resume/generate:
    post:
      operationId: postCandidateMeResumeGenerate
      tags: [resume]
      summary: Enqueue an ASYNC resume PDF generation
      description: |
        **202 — this only ENQUEUES.** The WORKER renders the PDF (Puppeteer,
        S7-B1); rendering takes seconds. The client POLLS
        `GET /candidates/me/resume/status` until READY — the same
        pending→confirmed discipline as S5 payments. There is no synchronous
        render and no completed URL in this response.

        The PDF snapshots the profile AND the settings AS OF THIS MOMENT —
        later edits to either require a new generation.
      responses:
        '202':
          description: Generation enqueued (status starts PENDING)
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [generationId, status]
                    properties:
                      generationId:
                        type: string
                        format: uuid
                      status:
                        type: string
                        enum: [PENDING]

  /candidates/me/resume/status:
    get:
      operationId: getCandidateMeResumeStatus
      tags: [resume]
      summary: THE POLL TARGET — the latest generation's status
      description: |
        Returns the candidate's LATEST generation. PENDING while the worker
        renders; READY carries a SHORT-EXPIRY signed R2 GET url (re-mint via
        `GET /candidates/me/resume/download` if it expires before the click);
        FAILED carries a human-readable `failureReason` — retry by
        regenerating.

        A settings change AFTER a generation went READY does NOT retroactively
        alter the stored PDF — `settingsApplied` on the rendered view is the
        snapshot that PDF was built from.
      responses:
        '200':
          description: The latest generation
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/ResumeGeneration'
        '404':
          description: No generation was ever triggered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                type: about:blank
                title: Not Found
                status: 404
                detail: No resume has been generated yet.
                code: RESUME_NOT_FOUND

  /candidates/me/resume/download:
    get:
      operationId: getCandidateMeResumeDownload
      tags: [resume]
      summary: Re-mint a signed download URL for the latest READY resume
      description: >
        The refresh affordance for an expired signed url (~5 min expiry is the
        system working, not breaking). 404 `RESUME_NOT_FOUND` when no READY
        resume exists.
      responses:
        '200':
          description: Signed download URL
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [url, expiresInSeconds]
                    properties:
                      url:
                        type: string
                        format: uri
                      expiresInSeconds:
                        type: integer
                        example: 300
        '404':
          description: No READY resume yet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /candidates/me/resume/send-whatsapp:
    post:
      operationId: postCandidateMeResumeSendWhatsapp
      tags: [resume]
      summary: Send the latest resume PDF to the candidate's OWN WhatsApp
      description: |
        Sends the latest READY resume as a WhatsApp DOCUMENT to the
        candidate's OWN verified number — no destination field exists or is
        accepted. The API enqueues; the WORKER owns the send. Audited
        server-side.

        - **Requires a READY resume** → 422 `RESUME_NOT_READY` when none (or
          the latest generation is PENDING/FAILED).
        - **`whatsappCapable: false` DEGRADES, it does not fail**: the send
          falls back to email-to-self and the 202 says so —
          `{ delivered: "EMAIL_FALLBACK" }` (S7-0 replaced the pre-freeze
          draft's 409 `WHATSAPP_NOT_CAPABLE`; a candidate without WhatsApp
          still gets their resume, and the honest answer is a success with the
          real channel, not an error).
        - **Rate-limited 5 sends/day/candidate** (CR-001) → 429
          `RESUME_SEND_LIMIT_EXCEEDED`.
      responses:
        '202':
          description: Delivery enqueued — the real channel stated
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/ResumeDeliveryResult'
        '422':
          description: No READY resume to send
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                type: about:blank
                title: Unprocessable Entity
                status: 422
                detail: Generate your resume before sending it.
                code: RESUME_NOT_READY
        '429':
          description: Daily send limit reached (5/day)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                type: about:blank
                title: Too Many Requests
                status: 429
                detail: You've reached today's resume send limit. Try again tomorrow.
                code: RESUME_SEND_LIMIT_EXCEEDED

  /candidates/me/resume/send-email:
    post:
      operationId: postCandidateMeResumeSendEmail
      tags: [resume]
      summary: Email the latest resume PDF to the candidate's own address
      description: |
        Sends ONLY to the candidate's registered account email — no `to` field
        exists or is accepted (the hard rule: "email to myself" can never
        become "email to an arbitrary address"). Requires a READY resume →
        422 `RESUME_NOT_READY`.

        NO dedicated daily cap (stated deliberately — email-to-self is cheap
        and self-limiting); only the global authenticated rate limit applies.
        The pre-freeze draft's 5/day on this endpoint moved to the WhatsApp
        send where the cost lives.
      responses:
        '202':
          description: Email enqueued
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/ResumeDeliveryResult'
        '422':
          description: No READY resume to send
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ══════════════════════════════════════════════════════════════════════════════
  # EMPLOYER — S2 FULL DETAIL
  # ══════════════════════════════════════════════════════════════════════════════

  /employers/register:
    post:
      operationId: postEmployersRegister
      tags: [employer]
      summary: Register employer company profile
      description: |
        Registers the employer's company details after account creation.
        The company starts with status PENDING and must be approved by an admin
        before the employer can post jobs.

        **Requires EMPLOYER role.** CANDIDATE callers receive 403 FORBIDDEN.
        Only one company per employer account — 409 COMPANY_ALREADY_EXISTS if
        the employer has already registered.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              # Registration submits a COMPLETE profile. Everything the onboarding
              # form shows is required here too — an employer must not be able to
              # reach the approval queue with a profile a reviewer cannot assess.
              # `languagePref` stays optional: it is not on the form and has a
              # server default.
              required:
                [
                  name,
                  type,
                  registrationNumber,
                  industryType,
                  foundedYear,
                  phoneCode,
                  phone,
                  country,
                  location,
                  website,
                  employeeRange,
                  description,
                  registrationCertKey,
                ]
              properties:
                name:
                  type: string
                  maxLength: 100
                  description: >
                    Must contain at least one letter or digit — a name made only
                    of punctuation/symbols is rejected.
                type:
                  $ref: '#/components/schemas/CompanyType'
                registrationNumber:
                  type: string
                industryType:
                  type: string
                foundedYear:
                  type: integer
                  minimum: 1800
                  description: >
                    Year of incorporation. Must not be in the future; the upper
                    bound is the CURRENT year, evaluated per request.
                  example: 2014
                phoneCode:
                  type: string
                  pattern: '^\+[0-9]{1,4}$'
                  example: '+91'
                phone:
                  type: string
                country:
                  type: string
                  maxLength: 60
                  example: India
                location:
                  type: string
                  description: City or area within `country`
                website:
                  type: string
                  format: uri
                employeeRange:
                  $ref: '#/components/schemas/EmployeeRange'
                languagePref:
                  type: string
                  enum: [en, hi, bn, mr, te, ta, gu, kn, ml, pa, or, as, ne, tl, id, si, am, sw, ur, fa, ps, ar]
                  default: en
                description:
                  type: string
                registrationCertKey:
                  type: string
                  description: >
                    R2 key returned by POST /employers/me/company/documents/presign
                    (which works BEFORE registration) after the direct PUT upload.
                    Ownership- and existence-validated; attached to the new company.
      responses:
        '201':
          description: Company profile created (status PENDING)
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Company'
        '403':
          description: Caller is not an EMPLOYER role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                type: about:blank
                title: Forbidden
                status: 403
                detail: Only EMPLOYER role users may register a company.
                code: FORBIDDEN
        '409':
          description: Company already registered for this account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                type: about:blank
                title: Company already registered
                status: 409
                detail: This employer account already has a registered company profile.
                code: COMPANY_ALREADY_EXISTS
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /employers/me/company:
    get:
      operationId: getEmployersMeCompany
      tags: [employer]
      summary: Get the authenticated employer's company profile
      responses:
        '200':
          description: Company profile
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Company'
        '404':
          description: No company profile registered yet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                type: about:blank
                title: Not found
                status: 404
                detail: No company profile found. Use POST /employers/register first.
                code: NOT_FOUND
    patch:
      operationId: patchEmployersMeCompany
      tags: [employer]
      summary: Update the authenticated employer's company profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 100
                  description: >
                    Must contain at least one letter or digit — a name made only
                    of punctuation/symbols is rejected.
                registrationNumber:
                  type: string
                industryType:
                  type: string
                phoneCode:
                  type: string
                  pattern: '^\+[0-9]{1,4}$'
                  example: '+91'
                phone:
                  type: string
                country:
                  type: string
                  maxLength: 60
                  example: India
                location:
                  type: string
                  description: City or area within `country`
                website:
                  type: string
                  format: uri
                foundedYear:
                  type: integer
                  minimum: 1800
                  description: >
                    Optional here, required on register — PATCH is a PARTIAL
                    update, so an absent key means "leave it alone", not "blank
                    it". Same range rule as register when present.
                  example: 2014
                employeeRange:
                  $ref: '#/components/schemas/EmployeeRange'
                languagePref:
                  type: string
                  enum: [en, hi, bn, mr, te, ta, gu, kn, ml, pa, or, as, ne, tl, id, si, am, sw, ur, fa, ps, ar]
                description:
                  type: string
      responses:
        '200':
          description: Updated company profile
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Company'
        '404':
          description: Company not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /employers/me/company/documents/presign:
    post:
      operationId: postEmployersMeCompanyDocumentsPresign
      tags: [employer]
      summary: Get a presigned R2 URL to upload the registration certificate
      description: |
        Issues a short-lived presigned PUT URL for direct R2 upload of the
        registration certificate. After upload, call
        `POST /employers/me/company/documents/confirm` with the returned `key`.

        Accepted: application/pdf, image/jpeg, image/png. Max 2 MB.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fileName, mimeType, sizeBytes]
              properties:
                fileName:
                  type: string
                  example: registration-cert.pdf
                mimeType:
                  type: string
                  example: application/pdf
                sizeBytes:
                  type: integer
      responses:
        '200':
          description: Presigned URL ready
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [uploadUrl, key, expiresInSeconds]
                    properties:
                      uploadUrl:
                        type: string
                        format: uri
                      key:
                        type: string
                      expiresInSeconds:
                        type: integer
                        example: 300
        '422':
          description: Invalid file type or exceeds 2 MB limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /employers/me/company/documents/confirm:
    post:
      operationId: postEmployersMeCompanyDocumentsConfirm
      tags: [employer]
      summary: Confirm the uploaded registration certificate
      description: |
        After PUT to the presigned URL succeeds, call this to record the
        certificate key on the company profile. The API performs a HEAD check;
        returns 422 UPLOAD_NOT_FOUND if the object is missing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key]
              properties:
                key:
                  type: string
                  description: R2 key returned by the presign endpoint
      responses:
        '200':
          description: Certificate recorded on company profile
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Company'
        '404':
          description: Company not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Upload not found (HEAD check failed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                type: about:blank
                title: Upload not found
                status: 422
                detail: The uploaded file was not found in storage. Please try uploading again.
                code: UPLOAD_NOT_FOUND

  # ── Employer: verification call ───────────────────────────────────────────────
  # The fast path around the 24-hour review queue. Booking a call does NOT change
  # company status — an admin still decides after speaking to them.
  /employers/me/verification-call:
    get:
      operationId: getEmployerMeVerificationCall
      tags: [employer]
      summary: The employer's current verification-call request
      responses:
        '200':
          description: The pending request, or null when none is booked
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    oneOf:
                      - $ref: '#/components/schemas/VerificationCallRequest'
                      - type: 'null'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: postEmployerMeVerificationCall
      tags: [employer]
      summary: Book or re-book a verification call
      description: |
        UPSERT keyed on the company — re-posting replaces the pending request
        rather than creating a second one, so this is both "schedule" and
        "reschedule".

        On success every admin holding `employers.approve_reject` is notified
        in-app and by email. Notification failure does NOT fail the booking:
        the request is already committed, and losing it to protect the message
        about it would be the wrong trade.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slotAt]
              properties:
                slotAt:
                  type: string
                  format: date-time
                  description: >
                    Proposed start as an ISO-8601 INSTANT. The employer picks a
                    moment in their timezone and an admin reads it in theirs, so
                    the value must carry an offset.
                note:
                  type: string
                  maxLength: 500
                  description: Optional context — a phone number, "after 6pm", a language.
      responses:
        '201':
          description: Call booked
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/VerificationCallRequest'
        '404':
          description: '`COMPANY_NOT_FOUND` — this user has no company'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: >
            `VERIFICATION_CALL_NOT_APPLICABLE` (company is not PENDING),
            `SLOT_IN_PAST`, or `SLOT_TOO_FAR` (meta.maxDaysAhead).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /employers/me/dashboard:
    get:
      operationId: getEmployersMeDashboard
      tags: [employer]
      summary: Get the employer's dashboard summary (Screen 15)
      description: |
        Returns the dashboard shape: KPIs (active jobs, totalApplications,
        shortlisted, totalJobViews, hiredThisMonth), recent active jobs,
        `recentApplicants`, and the computed `profileChecklist`.

        As of Sprint 4, `totalApplications` / `shortlisted` are live counts and
        `recentApplicants` is populated with employer-context `ApplicantSummary`
        rows (no phone/religion/dob). An empty array now means no applicants yet.

        `profileChecklist` is computed per-request — never stored as a percentage.
        Use its `hint` field to show the next actionable item to the employer.

        **403 EMPLOYER_NOT_APPROVED** if the company status is not APPROVED.
      responses:
        '200':
          description: Dashboard data
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/EmployerDashboard'
        '403':
          description: Company not yet approved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                type: about:blank
                title: Employer not approved
                status: 403
                detail: Your company profile is pending admin approval.
                code: EMPLOYER_NOT_APPROVED
        '404':
          description: No company profile registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /employers/me/jobs:
    get:
      operationId: getEmployersMeJobs
      tags: [employer]
      summary: List the employer's job postings — offset-paginated (Screen 17)
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/JobStatus'
        - name: search
          in: query
          description: Title keyword search
          schema:
            type: string
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
        - $ref: '#/components/parameters/SortParam'
      responses:
        '200':
          description: Paginated list of the employer's jobs (full Job schema)
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Job'
                  meta:
                    type: object
                    required: [page, pageSize, total, totalPages]
                    properties:
                      page:
                        type: integer
                      pageSize:
                        type: integer
                      total:
                        type: integer
                      totalPages:
                        type: integer

  # ══════════════════════════════════════════════════════════════════════════════
  # EMPLOYER PROFILE — S3 FULL DETAIL
  # ══════════════════════════════════════════════════════════════════════════════

  /employers/me/profile:
    get:
      operationId: getEmployersMeProfile
      tags: [employer]
      summary: Get the employer's full profile (S3)
      description: |
        Returns company details, hiring preferences, contact persons, logo URL,
        and the computed profile completeness checklist.

        **403 EMPLOYER_NOT_APPROVED** if company status is not APPROVED.
      responses:
        '200':
          description: Employer profile
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/EmployerProfile'
        '403':
          description: Company not approved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No company profile registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /employers/me/profile/hiring-preferences:
    patch:
      operationId: patchEmployersMeProfileHiringPreferences
      tags: [employer]
      summary: Upsert hiring preferences (S3)
      description: >
        Creates or replaces the employer's hiring preferences. The entire
        preferences object is replaced (not merged) on each call.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HiringPreferences'
      responses:
        '200':
          description: Preferences saved
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/HiringPreferences'
        '403':
          description: Company not approved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /employers/me/profile/contacts:
    post:
      operationId: postEmployersMeProfileContacts
      tags: [employer]
      summary: Add a contact person (S3)
      description: |
        Adds a display-only contact record to the employer's profile.
        **NOT a login account** — this creates a contact listing only.

        If `isPrimary: true`, any existing primary contact is auto-demoted to
        non-primary. Only one contact may be primary at a time.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, role, isPrimary]
              properties:
                name:
                  type: string
                role:
                  type: string
                phone:
                  type: string
                email:
                  type: string
                  format: email
                isPrimary:
                  type: boolean
      responses:
        '201':
          description: Contact person created
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/ContactPerson'
        '403':
          description: Company not approved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /employers/me/profile/contacts/{id}:
    patch:
      operationId: patchEmployersMeProfileContactById
      tags: [employer]
      summary: Update a contact person (S3)
      description: >
        Partial update of a contact record. Setting `isPrimary: true` auto-demotes
        the existing primary contact.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                role:
                  type: string
                phone:
                  type: string
                email:
                  type: string
                  format: email
                isPrimary:
                  type: boolean
      responses:
        '200':
          description: Contact updated
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/ContactPerson'
        '404':
          description: Contact not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      operationId: deleteEmployersMeProfileContactById
      tags: [employer]
      summary: Delete a contact person (S3)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Contact deleted
        '404':
          description: Contact not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /employers/me/profile/logo/presign:
    post:
      operationId: postEmployersMeProfileLogoPresign
      tags: [employer]
      summary: Get a presigned R2 URL to upload the company logo (S3)
      description: |
        Issues a short-lived presigned PUT URL for direct R2 upload of the
        company logo. After upload, call
        `POST /employers/me/profile/logo/confirm` with the returned `key`.

        Accepted: image/jpeg, image/png. Max 2 MB.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fileName, mimeType, sizeBytes]
              properties:
                fileName:
                  type: string
                  example: company-logo.jpg
                mimeType:
                  type: string
                  enum: [image/jpeg, image/png]
                sizeBytes:
                  type: integer
                  maximum: 2097152
      responses:
        '200':
          description: Presigned URL ready
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [uploadUrl, key, expiresInSeconds]
                    properties:
                      uploadUrl:
                        type: string
                        format: uri
                      key:
                        type: string
                      expiresInSeconds:
                        type: integer
                        example: 300
        '422':
          description: Invalid file type or exceeds 2 MB limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /employers/me/profile/logo/confirm:
    post:
      operationId: postEmployersMeProfileLogoConfirm
      tags: [employer]
      summary: Confirm the uploaded company logo (S3)
      description: >
        After PUT to the presigned URL succeeds, call this to record the logo key
        on the company profile. Returns the updated employer profile.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key]
              properties:
                key:
                  type: string
                  description: R2 key returned by the presign endpoint
      responses:
        '200':
          description: Logo confirmed
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/EmployerProfile'
        '422':
          description: Upload not found (HEAD check failed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                type: about:blank
                title: Upload not found
                status: 422
                detail: The uploaded file was not found in storage. Please try uploading again.
                code: UPLOAD_NOT_FOUND

  # ── Employer: candidate browse (S3) ──────────────────────────────────────────
  /employers/candidates:
    get:
      operationId: getEmployersCandidates
      tags: [employer]
      summary: Browse visible candidates (employer, cursor-paginated) (S3)
      description: |
        Returns cursor-paginated browse cards for candidates with
        `profileVisible = true`. **Candidates with `profileVisible = false` are
        NEVER returned** — they are excluded at query time.

        **Whitelisted query parameters only** — arbitrary field access is not
        allowed. Filtering/sorting beyond these parameters is not supported at MVP.

        Viewing a candidate's full profile (GET /employers/candidates/:id) is a
        separate call that records a profile view.
      parameters:
        - name: category
          in: query
          description: Filter by job category ID
          schema:
            type: string
            format: uuid
        - name: minExperienceYears
          in: query
          description: Minimum total years of experience (inclusive)
          schema:
            type: integer
            minimum: 0
        - name: hasForeignExperience
          in: query
          description: Filter to candidates with at least one FOREIGN experience entry
          schema:
            type: boolean
        - name: availability
          in: query
          description: Filter by isAvailable flag
          schema:
            type: boolean
        - name: q
          in: query
          description: Keyword search on fullName, currentLocation, and skills
          schema:
            type: string
        - $ref: '#/components/parameters/CursorParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Cursor-paginated candidate browse cards
          content:
            application/json:
              schema:
                type: object
                required: [data, nextCursor]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CandidateBrowseCard'
                  nextCursor:
                    type: [string, 'null']
        '403':
          description: Company not approved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ── Employer: view candidate profile (S3) ─────────────────────────────────────
  /employers/candidates/{id}:
    get:
      operationId: getEmployersCandidateById
      tags: [employer]
      summary: View a candidate's full profile (employer context, S3)
      description: |
        Returns the employer-context view of a candidate's profile.

        **Privacy invariants (enforced at API layer):**
        - `phone` is ABSENT (not null) when `showPhone = false`
        - `religion` is ABSENT (not null) when `showReligion = false`
        - `dob` is NEVER included — only derived `age`
        - `documentsStatus` contains status/validity ONLY — no keys, URLs, content
        - A `profileVisible = false` candidate returns **404** (identical to
          nonexistent — indistinguishable to the caller)

        **Side effect:** Records a profile view, deduplicated per (company, candidate)
        per rolling 24-hour window. On first view (or after 24 h), appends a
        `PROFILE_VIEWED` in-app notification to the candidate's notification feed
        (fire-and-forget — never blocks the response).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Candidate profile (employer context)
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/CandidateEmployerView'
        '403':
          description: Company not approved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Candidate not found or profile is hidden (profileVisible = false)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                type: about:blank
                title: Not found
                status: 404
                detail: Candidate not found.
                code: NOT_FOUND

  # ── Employer: candidate document access — the Pro gate (S5) ──────────────────
  /employers/candidates/{id}/documents/{type}/url:
    get:
      operationId: getEmployersCandidateDocumentUrl
      tags: [employer]
      summary: Get a signed candidate-document URL — Pro-plan gate (S5)
      description: |
        Issues a SHORT-EXPIRY signed R2 GET URL for one of the candidate's
        uploaded documents. This is the S3 decision-2 landing: the employer
        context exposed document STATUS only — actual document ACCESS is the
        Pro-plan feature.

        **Plan gate:** requires an APPROVED employer on an ACTIVE (or GRACE)
        Pro plan. Free-plan callers get 403 `PLAN_UPGRADE_REQUIRED` — the
        upsell driver; the UI routes it to the pricing page.

        **Privacy inheritance (S3 rules apply unchanged):**
        - A `profileVisible = false` candidate returns 404 IDENTICAL to
          nonexistent — a Pro employer probing an invisible candidate learns
          nothing (the S3 indistinguishability discipline).
        - Only document types the candidate has actually uploaded resolve;
          an absent document type is the SAME 404.
        - The Pro gate never bypasses `profileVisible` — the 404 checks run
          regardless of plan.

        **Audit:** EVERY issuance is written to the audit log (employer user,
        candidate, document type, timestamp). The signed URL and the object
        key are never logged.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: type
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/DocumentType'
      responses:
        '200':
          description: Short-expiry signed URL grant (issuance audited)
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/DocumentUrlGrant'
        '403':
          description: >
            `EMPLOYER_NOT_APPROVED` (company not approved) or
            `PLAN_UPGRADE_REQUIRED` (Free plan — the upsell driver). Branch on
            `code`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                type: about:blank
                title: Forbidden
                status: 403
                detail: Document access is a Pro feature. Upgrade to view candidate documents.
                code: PLAN_UPGRADE_REQUIRED
        '404':
          description: >
            Candidate not found, profile hidden (profileVisible = false), or
            this document type not uploaded — all byte-identical
            (indistinguishable to the caller).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                type: about:blank
                title: Not found
                status: 404
                detail: Not found.
                code: NOT_FOUND

  # ══════════════════════════════════════════════════════════════════════════════
  # JOBS — S2 FULL DETAIL
  # ══════════════════════════════════════════════════════════════════════════════

  /jobs:
    get:
      operationId: getJobs
      tags: [jobs]
      summary: Browse active job listings (public, SSR-crawlable, cursor-paginated)
      description: |
        **PUBLIC endpoint — no authentication required.** Returns only ACTIVE jobs.

        **FTS + trigram behavior:** `q` performs full-text search on title and
        description. `sort=relevance` ranks by FTS rank then `publishedAt` desc.
        `sort=recent` orders by `publishedAt` desc. `sort=salary` orders by
        `salaryMax` desc (nulls last).

        **Cursor pagination:** pass `nextCursor` from the previous response as
        `cursor` in the next request. `nextCursor = null` means no more results.

        `isSaved` is populated for authenticated candidate callers; null for
        unauthenticated (SSR / crawler) requests.
      security: []
      parameters:
        - name: market
          in: query
          schema:
            $ref: '#/components/schemas/JobMarket'
        - name: country
          in: query
          description: >
            Exact recruiting-country match (canonical English name, e.g. "India",
            "Oman"). Not a fixed enum: the searchable set is whatever countries
            currently have ACTIVE jobs — see GET /jobs/countries.
          schema:
            type: string
            maxLength: 60
          example: Oman
        - name: category
          in: query
          description: Filter by job category ID
          schema:
            type: string
            format: uuid
        - name: salaryMin
          in: query
          description: Minimum salary filter (inclusive)
          schema:
            type: integer
            minimum: 0
        - name: salaryMax
          in: query
          description: Maximum salary filter (inclusive)
          schema:
            type: integer
            minimum: 0
        - name: currency
          in: query
          description: Filter by salary currency (e.g. AED, INR)
          schema:
            type: string
        - name: badge
          in: query
          description: >
            Benefit badge filter — returns only jobs where the named benefit is true.
            Accepted: accommodation, healthInsurance, transportation.
          schema:
            type: string
            enum: [accommodation, healthInsurance, transportation]
        - name: q
          in: query
          description: Full-text / trigram search query (title + description)
          schema:
            type: string
        - name: sort
          in: query
          schema:
            type: string
            enum: [relevance, recent, salary]
            default: recent
        - $ref: '#/components/parameters/CursorParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Cursor-paginated list of job cards
          content:
            application/json:
              schema:
                type: object
                required: [data, nextCursor]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/JobCard'
                  nextCursor:
                    type: [string, 'null']

    post:
      operationId: postJobs
      tags: [jobs]
      summary: Create a new job posting as DRAFT (approved employer)
      description: |
        Creates a new job in DRAFT status. Not publicly visible until published.

        **Requires EMPLOYER role with an APPROVED company.** Returns 403
        EMPLOYER_NOT_APPROVED if the company is PENDING, REJECTED, or SUSPENDED.

        **Publish-time rules (NOT enforced at create — documented here for reference):**
        1. EMPLOYER_NOT_APPROVED (403) — enforced at publish only if company status changes.
        2. WORKER_PROTECTION_VIOLATION (422) — accommodation, healthInsurance, and
           transportation must all be `true`. `meta.violations[]` lists which rules failed.
        3. JOB_QUOTA_EXCEEDED (422) — quota = the plan's `maxActiveJobs` (S5):
           Free 1, Pro unlimited. `meta.planLimit` reflects the plan.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobCreateRequest'
      responses:
        '201':
          description: Job created (DRAFT)
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Job'
        '403':
          description: Employer company not approved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                type: about:blank
                title: Employer not approved
                status: 403
                detail: Your company must be approved by an admin before posting jobs.
                code: EMPLOYER_NOT_APPROVED
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /jobs/countries:
    get:
      operationId: getJobCountries
      tags: [jobs]
      summary: Countries that currently have ACTIVE jobs
      description: |
        The recruiting countries a candidate can actually filter by, derived from
        the live job set rather than a hard-coded list — a country appears here
        as soon as an employer publishes a job there, and disappears when the
        last one is archived. `count` lets the UI show how many jobs each has.

        Public: no auth, same as the search itself.
      security: []
      responses:
        '200':
          description: Countries with at least one ACTIVE job, alphabetical
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [country, count]
                      properties:
                        country:
                          type: string
                          example: Oman
                        count:
                          type: integer
                          example: 1

  /jobs/{id}:
    get:
      operationId: getJobById
      tags: [jobs]
      summary: Get public job detail (SSR-crawlable)
      description: |
        **PUBLIC endpoint — no authentication required.** Returns the full detail
        for a single ACTIVE job, including description, requirements, and up to
        5 similar jobs.

        `isSaved` is populated for authenticated candidate callers; null for
        unauthenticated requests.

        **No `companyId` or internal/employer-PII fields are returned.**
        404 is returned for non-ACTIVE (draft, paused, archived) jobs.
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Job detail
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/JobDetail'
        '404':
          description: Job not found or not active
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                type: about:blank
                title: Not found
                status: 404
                detail: Job not found or is not currently active.
                code: NOT_FOUND

    patch:
      operationId: patchJobById
      tags: [jobs]
      summary: Update a job posting (owning employer)
      description: >
        Partial update of an employer's own job. Allowed on DRAFT, ACTIVE, and
        PAUSED jobs. ARCHIVED jobs are read-only — returns 422 ILLEGAL_TRANSITION.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                market:
                  $ref: '#/components/schemas/JobMarket'
                location:
                  type: string
                description:
                  type: string
                categoryId:
                  type: string
                  format: uuid
                categoryOther:
                  type: string
                  maxLength: 80
                  description: >
                    Free-text trade name. Set ONLY when `categoryId` is the `other`
                    category; null/absent for every fixed trade. Required when that
                    category is chosen (400 `CATEGORY_OTHER_REQUIRED`) and rejected
                    otherwise (400 `CATEGORY_OTHER_NOT_ALLOWED`).
                salaryMin:
                  type: integer
                  minimum: 0
                salaryMax:
                  type: integer
                  minimum: 0
                salaryCurrency:
                  type: string
                accommodation:
                  type: boolean
                healthInsurance:
                  type: boolean
                transportation:
                  type: boolean
                workConditions:
                  type: string
                requirements:
                  type: array
                  items:
                    type: string
                experienceRequiredYears:
                  type: integer
                  minimum: 0
                vacancies:
                  type: integer
                  minimum: 1
                genderPreference:
                  $ref: '#/components/schemas/GenderPreference'
      responses:
        '200':
          description: Updated job
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Job'
        '403':
          description: Not the owning employer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Job not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: ARCHIVED job is read-only
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                type: about:blank
                title: Invalid transition
                status: 422
                detail: Archived jobs are read-only and cannot be edited.
                code: ILLEGAL_TRANSITION

  /jobs/{id}/publish:
    post:
      operationId: publishJob
      tags: [jobs]
      summary: Publish a job posting (owning employer)
      description: |
        Moves a DRAFT or PAUSED job to ACTIVE status.

        **Enforcement order (first failure short-circuits):**

        1. **EMPLOYER_NOT_APPROVED (403)** — The employer's company must have
           `status = APPROVED`. PENDING, REJECTED, and SUSPENDED companies cannot
           publish.

        2. **WORKER_PROTECTION_VIOLATION (422)** — All three of `accommodation`,
           `healthInsurance`, and `transportation` must be `true`. Returns 422 with
           `meta.violations[]` listing which fields failed (e.g.
           `["accommodation", "healthInsurance"]`).

        3. **JOB_QUOTA_EXCEEDED (422)** — the ACTIVE-job quota comes from the
           company's subscription plan (`Plan.maxActiveJobs`; S5): Free = 1,
           Pro = unlimited (null). Returns 422 with `meta.planLimit` set to the
           plan's limit and `meta.activeCount = N`. An ACTIVE/GRACE Pro
           subscription lifts the quota; after grace expires the FREE limit
           re-applies (Answer 07).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Job published (status ACTIVE)
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Job'
        '403':
          description: Employer company not approved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                type: about:blank
                title: Employer not approved
                status: 403
                detail: Your company must be approved before publishing jobs.
                code: EMPLOYER_NOT_APPROVED
        '404':
          description: Job not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Worker protection violation or quota exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                protectionViolation:
                  value:
                    type: about:blank
                    title: Worker protection violation
                    status: 422
                    detail: Job cannot be published — required worker benefits are missing.
                    code: WORKER_PROTECTION_VIOLATION
                    meta:
                      violations: [accommodation, transportation]
                quotaExceeded:
                  value:
                    type: about:blank
                    title: Job quota exceeded
                    status: 422
                    detail: Free plan allows 1 active job. Archive or pause your existing job first.
                    code: JOB_QUOTA_EXCEEDED
                    meta:
                      planLimit: 1
                      activeCount: 1

  /jobs/{id}/pause:
    post:
      operationId: pauseJob
      tags: [jobs]
      summary: Pause an active job (owning employer)
      description: >
        Moves an ACTIVE job to PAUSED status. Paused jobs are hidden from public
        search but can be resumed. Use archive for a permanent removal.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Job paused
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Job'
        '404':
          description: Job not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Job is not in ACTIVE status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                type: about:blank
                title: Invalid transition
                status: 422
                detail: Only ACTIVE jobs can be paused.
                code: ILLEGAL_TRANSITION

  /jobs/{id}/resume:
    post:
      operationId: resumeJob
      tags: [jobs]
      summary: Resume a paused job (owning employer)
      description: >
        Moves a PAUSED job back to ACTIVE status. The same publish-time rules
        (worker protection + quota) are re-evaluated.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Job resumed (ACTIVE)
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Job'
        '404':
          description: Job not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Job is not PAUSED or publish rules fail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /jobs/{id}/archive:
    post:
      operationId: archiveJob
      tags: [jobs]
      summary: Archive a job (owning employer)
      description: >
        Moves a DRAFT, ACTIVE, or PAUSED job to ARCHIVED status. Archived jobs
        are permanently read-only and not visible in public search. This
        transition is permanent — use pause to temporarily hide an active job.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Job archived
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Job'
        '404':
          description: Job not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Job is already ARCHIVED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                type: about:blank
                title: Invalid transition
                status: 422
                detail: Job is already archived.
                code: ILLEGAL_TRANSITION

  /jobs/{id}/duplicate:
    post:
      operationId: duplicateJob
      tags: [jobs]
      summary: Duplicate a job as a new DRAFT (owning employer)
      description: >
        Creates a new DRAFT job by copying all fields from the specified job.
        The new job starts in DRAFT status and must be published separately.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '201':
          description: New DRAFT job created from the copy
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Job'
        '404':
          description: Source job not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /jobs/{id}/save:
    post:
      operationId: saveJob
      tags: [jobs]
      summary: Save a job (authenticated candidate)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '201':
          description: Job saved
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [saved]
                    properties:
                      saved:
                        type: boolean
                        example: true
        '404':
          description: Job not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Job already saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                type: about:blank
                title: Already saved
                status: 409
                detail: This job is already in your saved list.
                code: ALREADY_SAVED
    delete:
      operationId: unsaveJob
      tags: [jobs]
      summary: Unsave a job (authenticated candidate)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Job unsaved
        '404':
          description: Job not found or not in saved list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ══════════════════════════════════════════════════════════════════════════════
  # ADMIN — S2: employer approval + settings
  # ══════════════════════════════════════════════════════════════════════════════

  /admin/employers:
    get:
      operationId: getAdminEmployers
      tags: [admin]
      summary: List all employer companies (admin, offset-paginated)
      description: >
        Returns offset-paginated list of all employer companies. Filterable by
        status and type. Requires admin bearer token.
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/CompanyStatus'
        - name: type
          in: query
          schema:
            $ref: '#/components/schemas/CompanyType'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
        - $ref: '#/components/parameters/SortParam'
      responses:
        '200':
          description: Paginated employer list
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Company'
                  meta:
                    type: object
                    required: [page, pageSize, total, totalPages]
                    properties:
                      page:
                        type: integer
                      pageSize:
                        type: integer
                      total:
                        type: integer
                      totalPages:
                        type: integer
        '403':
          description: Insufficient admin permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /admin/employers/{id}:
    get:
      operationId: getAdminEmployer
      tags: [admin]
      summary: One employer company by id (admin review detail)
      description: >
        **RBAC: `employers.view`** (same key as the list — reading one row is not
        a wider grant than reading the table). ADDED IN S6a-F2: Screen 24's
        review detail needs a single company, and no admin endpoint returned one.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The company
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Company'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '404':
          description: Company not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /admin/employers/{id}/approve:
    post:
      operationId: postAdminEmployerApprove
      tags: [admin]
      summary: Approve an employer company (admin)
      description: >
        Sets the employer's company status to APPROVED. After approval the
        employer can post jobs. Requires `employers.approve_reject` permission.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Employer approved
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Company'
        '404':
          description: Employer not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /admin/employers/{id}/reject:
    post:
      operationId: postAdminEmployerReject
      tags: [admin]
      summary: Reject an employer company (admin)
      description: >
        Sets the employer's company status to REJECTED. A `reason` is required
        and is visible to the employer via `Company.rejectionReason`. Requires
        `employers.approve_reject` permission.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  description: Reason for rejection (shown to the employer)
      responses:
        '200':
          description: Employer rejected
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Company'
        '404':
          description: Employer not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Reason is missing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /admin/employers/{id}/suspend:
    post:
      operationId: postAdminEmployerSuspend
      tags: [admin]
      summary: Suspend an employer company (admin)
      description: >
        Sets the employer's company status to SUSPENDED. All their ACTIVE jobs
        are paused automatically. Requires `employers.suspend` permission — a
        SEPARATE, higher grant than `employers.approve_reject` (MODERATOR holds
        approve/reject but not this; corrected in S6a-F2, the description
        previously named the wrong key).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Employer suspended
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Company'
        '404':
          description: Employer not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /admin/employers/{id}/reactivate:
    post:
      operationId: postAdminEmployerReactivate
      tags: [admin]
      summary: Reactivate a suspended employer (admin)
      description: >
        SUSPENDED → APPROVED only. Requires `employers.approve_reject`.
        ADDED IN S6a-F2: the endpoint has existed since S2-B4
        (AdminEmployerController) but was never frozen into the contract.
        The employer's paused jobs are NOT auto-resumed — the employer resumes
        them manually (a suspension is not erased by ending it).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Employer reactivated
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Company'
        '404':
          description: Employer not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Company is not currently SUSPENDED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /admin/plans:
    get:
      operationId: getAdminPlans
      tags: [admin]
      summary: List subscription plans with prices (admin)
      description: >
        **RBAC: `settings.view`.** Every plan including inactive ones —
        `isActive=false` is the kill switch, and a plan the console cannot show
        is one it cannot turn back on. Rendered inside Screen 28's Payments tab
        beside the GST rate.
      responses:
        '200':
          description: All plans, cheapest first
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdminPlan'
        '403':
          description: Missing settings.view
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /admin/plans/{code}:
    patch:
      operationId: patchAdminPlanPrice
      tags: [admin]
      summary: Update a plan's price (admin)
      description: |
        **RBAC: `settings.manage`.** Sets the price in INTEGER SUBUNITS (paise).

        Takes effect on the NEXT checkout — `CheckoutService` reads the price at
        order-creation time. It does NOT touch history: orders and invoices
        snapshot their own amounts at purchase, so nobody's past charge changes.
        Existing subscriptions run to their `expiresAt` and pay the new price on
        their next purchase.

        Two structural rules, both 422:
        `FREE_PLAN_NOT_PRICEABLE` — the zero-priced plan must stay at zero;
        pricing it would make Free purchasable.
        `PAID_PLAN_NEEDS_PRICE` — a paid plan cannot be set to zero; that would
        silently remove it from sale. Deactivate it instead.
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
          description: Plan code, e.g. PRO_MONTHLY.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [priceSubunits]
              properties:
                priceSubunits:
                  type: integer
                  minimum: 0
                  maximum: 100000000
                  description: Price in paise. 100000000 = 10,00,000.00.
      responses:
        '200':
          description: The updated plan
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/AdminPlan'
        '403':
          description: Missing settings.manage
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No plan with that code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: FREE_PLAN_NOT_PRICEABLE, PAID_PLAN_NEEDS_PRICE or PLAN_PRICE_INVALID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /admin/settings:
    get:
      operationId: getAdminSettings
      tags: [admin]
      summary: Get platform settings (admin)
      description: >
        **RBAC: `settings.view`.** Returns ALL platform settings as a flat list
        ordered by key. The client groups them into Screen 28's tabs by key
        prefix (worker_protection.* / jobs.* / candidates.* / payments.*).
      responses:
        '200':
          description: All platform settings
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Setting'
        '403':
          description: Not an admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      operationId: patchAdminSettings
      tags: [admin]
      summary: Update platform settings (admin; core rules require SUPER_ADMIN)
      description: |
        **RBAC: `settings.manage`.** Updates one or more settings by key.
        Settings where `isCoreRule = true` (the worker_protection.* trio) require
        SUPER_ADMIN regardless of settings.manage — other callers receive 403
        CORE_RULE_FORBIDDEN for those keys.

        Batch-atomic, validate-all-first: every entry is checked (type + core-rule
        gate) before ANY write; a single failure rejects the whole batch with no
        side effects. Send only the keys to update.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [updates]
              properties:
                updates:
                  type: array
                  items:
                    type: object
                    required: [key, value]
                    properties:
                      key:
                        type: string
                      value:
                        description: New value (type depends on the setting key)
      responses:
        '200':
          description: Updated settings list (all settings, not just changed ones)
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Setting'
        '403':
          description: ADMIN attempting to modify a core-rule setting
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                type: about:blank
                title: Core rule forbidden
                status: 403
                detail: Only SUPER_ADMIN may modify worker-protection core rules.
                code: CORE_RULE_FORBIDDEN
        '422':
          description: Unknown setting key or invalid value type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ══════════════════════════════════════════════════════════════════════════════
  # LATER-SPRINT STUBS — path + method + summary only; NOT_IMPLEMENTED response
  # ══════════════════════════════════════════════════════════════════════════════

  # ── Applications (Sprint 4) ───────────────────────────────────────────────────
  /jobs/{id}/apply:
    post:
      operationId: applyToJob
      tags: [jobs]
      summary: Apply to a job (candidate)
      description: >
        Candidate applies to an ACTIVE job. **Apply-gate error ladder** — checked
        fail-fast IN THIS EXACT ORDER, each with a distinct code:

        1. `JOB_NOT_ACTIVE` (422) — the job is not ACTIVE (draft/paused/archived).
        2. `ALREADY_APPLIED` (409) — this candidate already applied to this job.
        3. `PROFILE_INCOMPLETE` (422) — completion below the required threshold;
           `meta: { completionPct: int, threshold: int }`.
        4. `MANDATORY_DOCS_MISSING` (422) — a required document is absent;
           `meta: { missing: DocumentType[] }`.
        5. `PASSPORT_INVALID` (422) — passport expired or missing;
           `meta: { reason: "expired" | "missing" }`.

        On success (201) the match score is computed ONCE and snapshotted
        (`matchScore` + `matchBreakdown`), the gate snapshot fields are frozen
        (`docsCompleteCount` / `docsRequiredCount` / `passportValidAtApply`), the
        application enters PENDING with a DB-assigned `humanId` (`AP-YYYY-N`).

        **Side effects:** an in-app receipt notification to the candidate, and an
        in-app new-applicant notification to the employer.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                coverLetter:
                  type: string
                  maxLength: 500
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '201':
          description: Application created (PENDING) with match snapshot
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Application'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Caller is not a CANDIDATE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Job not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: '`ALREADY_APPLIED` — the candidate already applied to this job'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                type: about:blank
                title: Already applied
                status: 409
                detail: You have already applied to this job.
                code: ALREADY_APPLIED
        '422':
          description: >
            An apply-gate failure. `code` is one of (checked in order):
            `JOB_NOT_ACTIVE`, `PROFILE_INCOMPLETE` (meta.completionPct +
            meta.threshold), `MANDATORY_DOCS_MISSING` (meta.missing[]),
            `PASSPORT_INVALID` (meta.reason).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                jobNotActive:
                  value:
                    type: about:blank
                    title: Job not active
                    status: 422
                    detail: This job is not accepting applications.
                    code: JOB_NOT_ACTIVE
                profileIncomplete:
                  value:
                    type: about:blank
                    title: Profile incomplete
                    status: 422
                    detail: Complete your profile before applying.
                    code: PROFILE_INCOMPLETE
                    meta: { completionPct: 55, threshold: 70 }
                mandatoryDocsMissing:
                  value:
                    type: about:blank
                    title: Mandatory documents missing
                    status: 422
                    detail: Upload all required documents before applying.
                    code: MANDATORY_DOCS_MISSING
                    meta: { missing: [PASSPORT, EXPERIENCE_CERT] }
                passportInvalid:
                  value:
                    type: about:blank
                    title: Passport invalid
                    status: 422
                    detail: Your passport is expired.
                    code: PASSPORT_INVALID
                    meta: { reason: expired }

  /jobs/{id}/applicants:
    get:
      operationId: getJobApplicants
      tags: [jobs]
      summary: List applicants for a job (employer)
      description: >
        Employer lists applicants to their OWN job. Cursor-paginated. Each
        `ApplicantCard` reuses the S3 employer-context candidate subset, so the
        privacy omission semantics carry through (phone/religion omitted per the
        candidate's toggles, no dob, documents status-only). `counts` powers the
        status column headers on Screen 18.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/CursorParam'
        - $ref: '#/components/parameters/LimitParam'
        - name: status
          in: query
          description: Filter by application status.
          schema:
            $ref: '#/components/schemas/ApplicationStatus'
        - name: sort
          in: query
          description: '`match` = highest matchScore first; `recent` = newest first.'
          schema:
            type: string
            enum: [match, recent]
            default: match
      responses:
        '200':
          description: Applicant cards for the job
          content:
            application/json:
              schema:
                type: object
                required: [data, nextCursor, counts]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ApplicantCard'
                  nextCursor:
                    type: [string, 'null']
                  counts:
                    $ref: '#/components/schemas/ApplicantCounts'
        '403':
          description: Not the owning employer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Job not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /applications/{id}/status:
    patch:
      operationId: patchApplicationStatus
      tags: [jobs]
      summary: Update application status (employer, forward-only)
      description: >
        The owning employer moves an application FORWARD only. **Legal
        transitions:** PENDING → SHORTLISTED | SELECTED | REJECTED;
        SHORTLISTED → SELECTED | REJECTED. Any other move (including backward or
        same-state) → 422 `ILLEGAL_TRANSITION` with `meta: { from, to, allowed[] }`.
        Corrective/backward moves are ADMIN-ONLY (see
        PATCH /admin/applications/{id}/status).

        **SELECTED side effect:** the FIRST entry into SELECTED fires ONE WhatsApp
        (`wa.selected`) + email + in-app, and sets `selectedNotifiedAt`. Re-entry
        into SELECTED (e.g. after an admin correction) sends email + in-app ONLY —
        the WhatsApp never fires twice (guarded by `selectedNotifiedAt`).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  $ref: '#/components/schemas/ApplicationStatus'
                rejectionFeedback:
                  type: string
                  maxLength: 1000
                  description: Optional feedback shown to the candidate on REJECTED.
      responses:
        '200':
          description: Updated application
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Application'
        '403':
          description: Not the owning employer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Application not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: '`ILLEGAL_TRANSITION` — the move is not forward-only'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                type: about:blank
                title: Illegal transition
                status: 422
                detail: Employers can only move an application forward.
                code: ILLEGAL_TRANSITION
                meta: { from: SELECTED, to: PENDING, allowed: [] }

  /candidates/me/applications:
    get:
      operationId: getCandidateMeApplications
      tags: [candidates]
      summary: List the candidate's applications
      description: >
        The authenticated candidate's applications, cursor-paginated, newest
