                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ApplicationCard'
                  nextCursor:
                    type: [string, 'null']

  /candidates/me/applications/{id}:
    get:
      operationId: getCandidateMeApplicationById
      tags: [candidates]
      summary: Get one of the candidate's applications (with timeline)
      description: >
        Full candidate-facing application detail including the status `timeline`.
        Each timeline entry carries the actor's ROLE only (never identity) and
        `isAdminOverride`. The admin `overrideReason` is DELIBERATELY EXCLUDED
        from this candidate view — it is admin/audit-facing only.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
