services:
  skillindiaconnect-postgres:
    image: postgres:16
    container_name: skillindiaconnect-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-skillindiaconnect_dev}
    ports:
      - '5433:5432'
    volumes:
      - skillindiaconnect-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres}']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  skillindiaconnect-redis:
    image: redis:7
    container_name: skillindiaconnect-redis
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  skillindiaconnect-minio:
    image: minio/minio:latest
    container_name: skillindiaconnect-minio
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_API_CORS_ALLOW_ORIGIN: 'http://localhost:3000'
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - skillindiaconnect-minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  skillindiaconnect-minio-init:
    image: minio/mc:latest
    container_name: skillindiaconnect-minio-init
    depends_on:
      skillindiaconnect-minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://skillindiaconnect-minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/skillindiaconnect-dev &&
        mc anonymous set download local/skillindiaconnect-dev &&
        echo 'MinIO init done'
      "
    restart: 'no'

volumes:
  skillindiaconnect-pgdata:
  skillindiaconnect-minio-data:
