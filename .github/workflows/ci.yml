name: CI
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup # Prisma client present via postinstall
      - run: pnpm typecheck

  test:
    runs-on: ubuntu-latest # integration tests (added later) use Testcontainers;
    steps: # Docker is available on ubuntu-latest
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # The S7 PDF worker specs (pdf/browser-pool.spec.ts) launch REAL Chromium
      # via Puppeteer with no CHROMIUM_EXECUTABLE_PATH, so they need Puppeteer's
      # OWN browser. Install the system libraries Chromium needs (via Playwright),
      # then Puppeteer's Chrome (pnpm doesn't run puppeteer's browser-download
      # postinstall by default).
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm --filter ./apps/api exec puppeteer browsers install chrome
      - run: pnpm test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm build

  env-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm check:env

  migrate-check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sic
          POSTGRES_PASSWORD: sic
          POSTGRES_DB: skillindiaconnect_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sic"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://sic:sic@localhost:5432/skillindiaconnect_test
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Apply migrations from empty
        run: pnpm --filter ./apps/api exec prisma migrate deploy
      - name: Fail on schema↔database drift
        run: >-
          pnpm --filter ./apps/api exec prisma migrate diff
          --from-url postgresql://sic:sic@localhost:5432/skillindiaconnect_test
          --to-schema-datamodel ./prisma/schema.prisma
          --exit-code

  # ── UI-REGRESSION suite (Category A) — Playwright + MSW ──────────────────────
  # Job id kept as `e2e` so existing required-status-checks keep matching; it is
  # the MSW UI-regression layer per docs/testing-architecture.md (the real-stack
  # E2E layer is deferred to post-handoff). Playwright starts `next dev` with
  # NEXT_PUBLIC_API_MOCKING=enabled (playwright.config.ts webServer.env), so MSW
  # serves every /api/v1/* call — NO real API, Postgres or Redis is needed.
  e2e:
    runs-on: ubuntu-latest
    # SHARDING: the suite is split across 4 jobs so it runs on 4 runners in
    # parallel (wall-clock ~4× lower). `--shard=N/4` partitions the tests; see
    # playwright.config.ts. Each shard is an isolated runner with its own MSW
    # server, so shards cannot interfere.
    strategy:
      fail-fast: false # one shard failing shouldn't hide results from the others
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # The web dev server imports @skillindiaconnect/shared-types from its dist,
      # so the workspace packages must be built before `next dev` starts.
      - run: pnpm --filter "./packages/*" build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Run UI-regression suite (MSW)
        # Playwright's webServer boots `next dev` with MSW enabled and waits for
        # http://localhost:3000 before the specs run.
        run: pnpm exec playwright test --shard=${{ matrix.shard }}/4
      - name: Upload traces + report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          # Artifact names must be unique per matrix job or the upload collides.
          name: e2e-debug-shard-${{ matrix.shard }}
          path: |
            blob-report/
            test-results/
          retention-days: 7
      # The blob reports from every shard merge into ONE browsable HTML report,
      # so a failure is still investigated in a single place rather than by
      # opening four partial reports.
      - name: Upload blob report for merging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-shard-${{ matrix.shard }}
          path: blob-report/
          retention-days: 1

  e2e-report:
    # Merges the sharded blob reports into a single HTML report. `always()` so
    # the report exists precisely when it is most needed — after a failure.
    if: always()
    needs: [e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with:
          path: all-blob-reports
          pattern: blob-report-shard-*
          merge-multiple: true
      - run: pnpm exec playwright merge-reports --reporter html ./all-blob-reports
      - uses: actions/upload-artifact@v4
        with:
          name: e2e-html-report
          path: playwright-report/
          retention-days: 7

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks needs full history
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE is required ONLY for organization-owned repos.
          # Personal/public repos run free. Uncomment and add the secret if org-owned:
          # GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  pr-guards:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Migration-reviewed gate + small-PR warning
        uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require('node:child_process');
            const base = `origin/${context.payload.pull_request.base.ref}`;
            execSync(`git fetch origin ${context.payload.pull_request.base.ref} --depth=1`);
            const changed = execSync(`git diff --name-only ${base}...HEAD`)
              .toString().split('\n').filter(Boolean);

            // 1) Migration-reviewed gate (BLOCKING)
            const touchesMigrations = changed.some(f =>
              f.startsWith('apps/api/prisma/migrations/'));
            if (touchesMigrations) {
              const labels = context.payload.pull_request.labels.map(l => l.name);
              if (!labels.includes('migration-reviewed')) {
                core.setFailed(
                  'This PR changes files under apps/api/prisma/migrations/. ' +
                  'A second reviewer must review the raw SQL and apply the ' +
                  '`migration-reviewed` label before it can merge.');
              }
            }

            // 2) Small-PR warning (NON-BLOCKING annotation)
            const numstat = execSync(`git diff --numstat ${base}...HEAD`)
              .toString().split('\n').filter(Boolean);
            const isExcluded = f =>
              f === 'pnpm-lock.yaml' || f.includes('/migrations/') ||
              f.endsWith('.generated.ts') || f.includes('/generated/');
            let lines = 0;
            for (const row of numstat) {
              const [add, del, file] = row.split('\t');
              if (add === '-' || isExcluded(file)) continue;
              lines += Number(add) + Number(del);
            }
            if (lines > 400) {
              core.warning(
                `This PR changes ~${lines} non-generated lines (soft ceiling 400). ` +
                `Consider splitting into smaller reviewable units.`);
            }
